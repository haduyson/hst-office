<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1910" height="1000" viewBox="0 0 1910 1000" role="img" aria-labelledby="title description" xml:lang="vi">
  <title id="title">HST OFFICE · Bộ ứng dụng văn phòng dành cho người Việt · MIỄN PHÍ VĨNH VIỄN</title>
  <desc id="description">Dùng trọn đời · Không thu phí bản quyền. Văn bản, Bảng tính, Trình chiếu. Mẫu văn bản hành chính theo Nghị định 30. Chuyển mã TCVN3, VNI sang Unicode. Tương thích tệp Word, Excel, PowerPoint. Tải miễn phí tại hasontech.vn. Sản phẩm của HASON TECH.</desc>
  <defs>
    <linearGradient id="reading-surface" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="0.76" stop-color="#FFFFFF" stop-opacity="0.58"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="button-fill" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#0B6FC1"/>
      <stop offset="1" stop-color="#085DA5"/>
    </linearGradient>
    <g id="check">
      <circle r="16" fill="#E2F0FB"/>
      <path d="M-7 0 -2 5 8 -6" fill="none" stroke="#0B6FC1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>

  <image xlink:href="bg-quangba.png" x="0" y="0" width="1910" height="1000" preserveAspectRatio="xMidYMid slice"/>
  <rect x="0" y="0" width="1090" height="1000" fill="url(#reading-surface)"/>

  <!-- Original supplied horizontal logo, scaled uniformly. -->
  <image xlink:href="hst-logo.svg" x="88" y="52" width="444" height="116.384328" preserveAspectRatio="xMidYMid meet"/>

  <g font-family="Noto Sans" fill="#322E2E">
    <text x="96" y="252" font-size="68" font-weight="700" letter-spacing="-1.5">Bộ ứng dụng văn phòng</text>
    <text x="96" y="342" font-size="76" font-weight="700" letter-spacing="-1.7" fill="#0B6FC1">dành cho người Việt</text>

    <rect x="96" y="378" width="656" height="88" rx="16" fill="#E8710A"/>
    <text x="424" y="450" text-anchor="middle" font-size="54" font-weight="700" fill="#05162C">MIỄN PHÍ VĨNH VIỄN</text>
    <text x="96" y="508" font-size="30" font-weight="400" fill="#536476">Dùng trọn đời · Không thu phí bản quyền</text>

    <!-- The three product modules share one card and icon system. -->
    <g transform="translate(96 542)">
      <rect width="248" height="82" rx="16" fill="#F0F3FF" stroke="#D8E0F7"/>
      <rect x="18" y="19" width="44" height="44" rx="11" fill="#2F4FC4"/>
      <g transform="translate(29 28)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 0h13l7 7v19H2z M15 0v7h7 M7 13h10 M7 18h10"/>
      </g>
      <text x="79" y="52" font-size="29" font-weight="700" fill="#2F4FC4">Văn bản</text>
    </g>
    <g transform="translate(360 542)">
      <rect width="248" height="82" rx="16" fill="#EEF7F1" stroke="#D5EADC"/>
      <rect x="18" y="19" width="44" height="44" rx="11" fill="#1E8E3E"/>
      <g transform="translate(28 28)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="1" y="1" width="24" height="24" rx="2"/>
        <path d="M1 9h24 M1 17h24 M9 9v16 M17 9v16"/>
      </g>
      <text x="79" y="52" font-size="29" font-weight="700" fill="#176C30">Bảng tính</text>
    </g>
    <g transform="translate(624 542)">
      <rect width="280" height="82" rx="16" fill="#FFF4EA" stroke="#F7DDC6"/>
      <rect x="18" y="19" width="44" height="44" rx="11" fill="#E8710A"/>
      <g transform="translate(27 29)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="0" y="0" width="27" height="19" rx="2"/>
        <path d="M13.5 19v6 M7 26l6.5-5 6.5 5 M7 13V9 M13.5 13V5 M20 13V7"/>
      </g>
      <text x="79" y="52" font-size="29" font-weight="700" fill="#A74D00">Trình chiếu</text>
    </g>

    <g font-size="30" font-weight="400">
      <use xlink:href="#check" x="112" y="659"/>
      <text x="145" y="670">Mẫu văn bản hành chính theo Nghị định 30</text>
      <use xlink:href="#check" x="112" y="713"/>
      <text x="145" y="724">Chuyển mã TCVN3, VNI sang Unicode</text>
      <use xlink:href="#check" x="112" y="767"/>
      <text x="145" y="778">Tương thích tệp Word, Excel, PowerPoint</text>
    </g>

    <g>
      <rect x="96" y="827" width="650" height="84" rx="18" fill="#0B6FC1" opacity="0.12" transform="translate(0 8)"/>
      <rect x="96" y="821" width="650" height="84" rx="18" fill="url(#button-fill)"/>
      <g transform="translate(126 846)" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 0v20 M8 13l7 7 7-7 M2 24v8h26v-8"/>
      </g>
      <text x="180" y="875" font-size="32" font-weight="700" fill="#FFFFFF">Tải miễn phí tại hasontech.vn</text>
      <path d="M691 863h22 M706 856l7 7-7 7" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="96" y="956" font-size="24" fill="#536476">Sản phẩm của <tspan font-weight="700" fill="#322E2E">HASON TECH</tspan></text>
  </g>
</svg>
