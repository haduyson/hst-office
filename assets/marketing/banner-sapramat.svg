<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1910" height="1000" viewBox="0 0 1910 1000" role="img" aria-labelledby="title description" xml:lang="vi">
  <title id="title">SẮP RA MẮT · HST OFFICE · MIỄN PHÍ VĨNH VIỄN</title>
  <desc id="description">Dùng trọn đời · Không thu phí bản quyền. Bộ ứng dụng văn phòng thuần Việt. Văn bản · Bảng tính · Trình chiếu. Theo dõi tại hasontech.vn. HASON TECH.</desc>
  <defs>
    <linearGradient id="reading-shade" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#05162C" stop-opacity="0.40"/>
      <stop offset="0.75" stop-color="#05162C" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#05162C" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="reveal-type" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#A6D8FF"/>
    </linearGradient>
    <linearGradient id="follow-fill" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#0B6FC1" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0B6FC1" stop-opacity="0.20"/>
    </linearGradient>
  </defs>

  <image xlink:href="bg-sapramat.png" x="0" y="0" width="1910" height="1000" preserveAspectRatio="xMidYMid slice"/>
  <rect x="0" y="0" width="1110" height="1000" fill="url(#reading-shade)"/>

  <!-- A light carrier preserves the supplied logo's original dark wordmark. -->
  <rect x="96" y="64" width="454" height="142" rx="18" fill="#FFFFFF"/>
  <image xlink:href="hst-logo.svg" x="115" y="80" width="416" height="109.044776" preserveAspectRatio="xMidYMid meet"/>

  <g font-family="Noto Sans">
    <text x="96" font-size="136" font-weight="700" letter-spacing="-4" fill="url(#reveal-type)">
      <tspan x="96" y="420">SẮP RA MẮT</tspan>
    </text>

    <rect x="96" y="472" width="656" height="88" rx="16" fill="#0E7A36"/>
    <text x="424" y="544" text-anchor="middle" font-size="54" font-weight="800" fill="#FFFFFF">MIỄN PHÍ VĨNH VIỄN</text>
    <text x="100" y="608" font-size="30" font-weight="400" fill="#F0F7FF">Dùng trọn đời · Không thu phí bản quyền</text>

    <text x="100" y="690" font-size="34" font-weight="400" fill="#F0F7FF">Bộ ứng dụng văn phòng thuần Việt</text>
    <text x="100" y="736" font-size="30" font-weight="400" fill="#C2D9EF">Văn bản · Bảng tính · Trình chiếu</text>

    <rect x="96" y="790" width="570" height="76" rx="18" fill="url(#follow-fill)" stroke="#79BBEF" stroke-opacity="0.70" stroke-width="1.5"/>
    <text x="128" y="840" font-size="32" font-weight="400" fill="#FFFFFF">Theo dõi tại <tspan font-weight="700">hasontech.vn</tspan></text>
    <path d="M610 828h24 M626 820l8 8-8 8" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="100" y="940" font-size="24" font-weight="700" letter-spacing="4" fill="#AFC6DD">HASON TECH</text>
  </g>
</svg>
