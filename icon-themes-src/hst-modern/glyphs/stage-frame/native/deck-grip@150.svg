<svg xmlns="http://www.w3.org/2000/svg" width="6" height="24" viewBox="0 0 6 24">
  <title>HST deck-grip</title>
  <desc>Four grip dots form a vertical column with a teal foot on the last dot.</desc>
  <g fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1" y="2" width="3" height="3" rx="0.5" fill="currentColor" stroke="none" />
    <rect x="1" y="8" width="3" height="3" rx="0.5" fill="currentColor" stroke="none" />
    <rect x="1" y="14" width="3" height="3" rx="0.5" fill="currentColor" stroke="none" />
    <rect x="1" y="20" width="3" height="3" rx="0.5" fill="currentColor" stroke="none" />
    <rect x="1" y="22" width="3" height="1" fill="#008F7A" stroke="none" />
  </g>
</svg>
