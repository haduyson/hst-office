<svg xmlns="http://www.w3.org/2000/svg" width="4" height="16" viewBox="0 0 4 16">
  <title>HST deck-grip</title>
  <desc>Four grip dots form a vertical column with a teal foot on the last dot.</desc>
  <g fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1" y="1" width="2" height="2" fill="currentColor" stroke="none" />
    <rect x="1" y="5" width="2" height="2" fill="currentColor" stroke="none" />
    <rect x="1" y="9" width="2" height="2" fill="currentColor" stroke="none" />
    <rect x="1" y="13" width="2" height="2" fill="currentColor" stroke="none" />
    <rect x="1" y="14" width="2" height="1" fill="#008F7A" stroke="none" />
  </g>
</svg>
