    <rect x="3" y="7" width="14" height="10" fill="#3478DA" stroke="none" />
    <rect x="30" y="7" width="15" height="10" fill="#3478DA" stroke="none" />
    <rect x="5" y="11" width="10" height="2" fill="currentColor" stroke="none" />
    <rect x="32" y="11" width="11" height="2" fill="currentColor" stroke="none" />
    <rect x="22" y="7" width="1" height="11" fill="currentColor" stroke="none" />
    <rect x="19" y="11" width="8" height="2" fill="currentColor" stroke="none" />
  </g>
