<svg xmlns="http://www.w3.org/2000/svg" width="80" height="40" viewBox="0 0 80 40">
  <title>HST selection-extending</title>
  <desc>A right arrow carries the blue selection farther along the text line.</desc>
  <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="5" y="13" width="36" height="15" fill="#3478DA" stroke="none" />
    <rect x="10" y="19" width="9" height="3" fill="currentColor" stroke="none" />
    <rect x="26" y="19" width="10" height="3" fill="currentColor" stroke="none" />
    <rect x="44" y="19" width="25" height="3" fill="currentColor" stroke="none" />
    <path d="M44 20h30m-10-10 10 10-10 10" />
  </g>
</svg>
