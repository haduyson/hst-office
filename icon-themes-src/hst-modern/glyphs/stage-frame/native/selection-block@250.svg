<svg xmlns="http://www.w3.org/2000/svg" width="80" height="40" viewBox="0 0 80 40">
  <title>HST selection-block</title>
  <desc>A rectangular blue selection spans the same columns on two lines of text.</desc>
  <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="20" y="5" width="30" height="30" fill="#3478DA" stroke="none" />
    <rect x="5" y="13" width="18" height="2" fill="currentColor" stroke="none" />
    <rect x="28" y="13" width="15" height="3" fill="currentColor" stroke="none" />
    <rect x="28" y="25" width="13" height="3" fill="currentColor" stroke="none" />
    <rect x="50" y="25" width="25" height="3" fill="currentColor" stroke="none" />
  </g>
</svg>
