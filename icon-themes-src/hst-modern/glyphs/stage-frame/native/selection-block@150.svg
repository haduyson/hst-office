<svg xmlns="http://www.w3.org/2000/svg" width="48" height="24" viewBox="0 0 48 24">
  <title>HST selection-block</title>
  <desc>A rectangular blue selection spans the same columns on two lines of text.</desc>
  <g fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
    <rect x="12" y="3" width="18" height="18" fill="#3478DA" stroke="none" />
    <rect x="3" y="7" width="11" height="2" fill="currentColor" stroke="none" />
    <rect x="17" y="7" width="7" height="1" fill="currentColor" stroke="none" />
    <rect x="17" y="15" width="7" height="1" fill="currentColor" stroke="none" />
    <rect x="30" y="15" width="15" height="2" fill="currentColor" stroke="none" />
  </g>
</svg>
