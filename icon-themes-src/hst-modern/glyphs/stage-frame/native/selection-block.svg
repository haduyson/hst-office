<svg xmlns="http://www.w3.org/2000/svg" width="32" height="16" viewBox="0 0 32 16">
  <title>HST selection-block</title>
  <desc>A rectangular blue selection spans the same columns on two lines of text.</desc>
  <g fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
    <rect x="8" y="2" width="12" height="12" fill="#3478DA" stroke="none" />
    <rect x="2" y="5" width="7" height="1" fill="currentColor" stroke="none" />
    <rect x="11" y="5" width="6" height="1" fill="currentColor" stroke="none" />
    <rect x="11" y="10" width="6" height="1" fill="currentColor" stroke="none" />
    <rect x="20" y="10" width="10" height="1" fill="currentColor" stroke="none" />
  </g>
</svg>
