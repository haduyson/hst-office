    <rect x="2" y="5" width="14" height="6" fill="#3478DA" stroke="none" />
    <rect x="4" y="8" width="4" height="1" fill="currentColor" stroke="none" />
    <rect x="10" y="8" width="4" height="1" fill="currentColor" stroke="none" />
    <path d="M17.5 8.5h12m-4-4 4 4-4 4" />
  </g>
