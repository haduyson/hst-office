<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 10 10">
  <title>HST zoom-out</title>
  <desc>A broad minus carries a short blue glint along its upper edge.</desc>
  <g fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="4" width="10" height="3" fill="currentColor" stroke="none" />
    <rect x="1" y="4" width="4" height="1" fill="#3478DA" stroke="none" />
  </g>
</svg>
