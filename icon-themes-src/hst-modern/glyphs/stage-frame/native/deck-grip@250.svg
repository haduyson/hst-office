<svg xmlns="http://www.w3.org/2000/svg" width="10" height="40" viewBox="0 0 10 40">
  <title>HST deck-grip</title>
  <desc>Four grip dots form a vertical column with a teal foot on the last dot.</desc>
  <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="3" width="5" height="5" rx="0.75" fill="currentColor" stroke="none" />
    <rect x="2" y="13" width="5" height="5" rx="0.75" fill="currentColor" stroke="none" />
    <rect x="2" y="23" width="5" height="5" rx="0.75" fill="currentColor" stroke="none" />
    <rect x="2" y="33" width="5" height="5" rx="0.75" fill="currentColor" stroke="none" />
    <rect x="2" y="36" width="5" height="2" fill="#008F7A" stroke="none" />
  </g>
</svg>
