<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <title>HST objectalignleft</title>
  <desc>Two coloured boxes aligned to a bar on the left. Hand-tuned 16 px grid: square box corners and a solid 2 px bar so every edge falls on a pixel edge.</desc>
  <rect x="1" y="1" width="2" height="14" fill="currentColor" stroke="none"/>
  <rect x="5" y="2" width="10" height="5" fill="#3478DA" stroke="none"/>
  <rect x="5" y="9" width="7" height="5" fill="#8954C7" stroke="none"/>
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <rect x="5.5" y="2.5" width="9" height="4" stroke-width="1"/>
    <rect x="5.5" y="9.5" width="6" height="4" stroke-width="1"/>
  </g>
</svg>
