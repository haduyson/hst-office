    :root {
      color-scheme: light;
      --canvas-width: 1200px;
      --canvas-height: 630px;
      --safe-x: 64px;
      --safe-y: 48px;
      --copy-width: 648px;
      --white: #fff;
      --paper: #f7fbff;
      --interface-bg: #f5f5f5;
      --ink: #172d47;
      --navy: #061b36;
      --muted: #536379;
      --line: #dce6f0;
      --brand: #0b6fc1;
      --brand-dark: #07569a;
      --writer: #2f5bd3;
      --sheets: #1e8e3e;
      --slides: #e8590c;
      --free: #0e7a36;
      --accent: var(--brand);
      --accent-dark: var(--brand-dark);
      --tint: #e6f3ff;
      --glow: #bddfff;
      --glass: #ffffffbd;
      --glass-edge: #ffffffed;
      --shadow: #07569a1c;
      --radius: 24px;
      --title-max: 68px;
      --title-min: 50px;
      --title-leading: 1.22;
      --body-size: 26px;
      --label-size: 18px;
      --app-mark-size: 64px;
      --window-bar-height: 40px;
      --footer-size: 20px;
      --credit-size: 13px;
      --space-1: 8px;
      --space-2: 16px;
      --space-3: 20px;
      --space-4: 24px;
      --space-5: 32px;
      --art-left: 760px;
      --art-top: 168px;
    }

    * { box-sizing: border-box; }
    html, body {
      width: var(--canvas-width);
      height: var(--canvas-height);
      margin: 0;
      overflow: hidden;
    }
    body {
      position: relative;
      isolation: isolate;
      background: var(--paper);
      color: var(--ink);
      font-family: 'Be Vietnam Pro', 'BVP Fallback', sans-serif;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
    }
    body[data-accent="writer"] {
      --accent: var(--writer);
      --accent-dark: #2349b0;
      --tint: #eaf0ff;
      --glow: #c6d6ff;
      --shadow: #2f5bd31c;
    }
    body[data-accent="sheets"] {
      --accent: var(--sheets);
      --accent-dark: #176c30;
      --tint: #e8f5ec;
      --glow: #c2e7cf;
      --shadow: #1e8e3e1c;
    }
    body[data-accent="slides"] {
      --accent: var(--slides);
      --accent-dark: #ad4007;
      --tint: #fff0e5;
      --glow: #ffdbc0;
      --shadow: #e8590c1c;
    }
    [hidden] { display: none !important; }
    .backdrop {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: -1;
      background:
        radial-gradient(ellipse at 100% 70%, var(--glow), transparent 52%),
        linear-gradient(112deg, var(--white) 22%, var(--paper) 62%, var(--tint));
    }
    .backdrop::before, .backdrop::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      transform: rotate(-32deg);
    }
    .backdrop::before {
      width: 760px;
      height: 920px;
      left: 800px;
      top: -160px;
      border: 2px solid var(--glass-edge);
      background: linear-gradient(120deg, var(--glass), transparent 46%, var(--glow));
      box-shadow: -28px 0 70px var(--shadow);
    }
    .backdrop::after {
      width: 650px;
      height: 800px;
      left: 940px;
      top: -40px;
      border: 1px solid var(--glass-edge);
      background: linear-gradient(125deg, var(--white), transparent 48%);
    }
    .brand-logo {
      position: absolute;
      left: var(--safe-x);
      top: 52px;
      display: block;
      width: 248px;
      height: auto;
    }
    .app-mark {
      position: absolute;
      right: var(--safe-x);
      top: 56px;
      width: var(--app-mark-size);
      height: var(--app-mark-size);
    }
    .app-mark img { display: block; width: 100%; height: 100%; }
    .copy {
      position: absolute;
      left: var(--safe-x);
      top: 174px;
      width: var(--copy-width);
    }
    .kicker {
      display: inline-block;
      max-width: 100%;
      margin: 0;
      padding: var(--space-1) var(--space-2);
      border-radius: 999px;
      background: var(--tint);
      color: var(--accent-dark);
      font-size: var(--label-size);
      font-weight: 700;
      line-height: 24px;
      letter-spacing: .055em;
      text-transform: uppercase;
    }
    body[data-slug="trang-chu"] .kicker {
      background: var(--free);
      color: var(--white);
    }
    h1 {
      width: 100%;
      margin: var(--space-3) 0 0;
      color: var(--ink);
      font-size: var(--title-max);
      font-weight: 800;
      line-height: var(--title-leading);
      letter-spacing: -.035em;
      text-wrap: balance;
      overflow-wrap: normal;
    }
    .last-words { white-space: nowrap; }
    h1.explicit-lines { white-space: pre; text-wrap: nowrap; }
    .subtitle {
      width: 620px;
      max-width: 100%;
      margin: var(--space-3) 0 0;
      color: var(--muted);
      font-size: var(--body-size);
      line-height: 1.5;
      text-wrap: pretty;
    }
    .footer {
      position: absolute;
      left: var(--safe-x);
      bottom: 52px;
      width: var(--copy-width);
      padding-top: var(--space-3);
      border-top: 1px solid var(--line);
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: var(--space-2);
    }
    .domain {
      color: var(--brand-dark);
      font-size: var(--footer-size);
      font-weight: 700;
      line-height: 28px;
      white-space: nowrap;
    }
    .credit {
      color: var(--muted);
      font-size: var(--credit-size);
      line-height: 22px;
      white-space: nowrap;
    }
    .credit strong { color: var(--ink); font-weight: 700; }
    .illustration {
      position: absolute;
      left: var(--art-left);
      top: var(--art-top);
    }
    .app-window {
      width: 620px;
      height: 444px;
      padding: var(--space-1);
      border-radius: var(--radius);
      background: linear-gradient(145deg, var(--glass-edge), var(--tint));
      box-shadow: 0 28px 64px var(--shadow), 0 4px 12px var(--shadow);
    }
    .window-bar {
      height: var(--window-bar-height);
      display: flex;
      align-items: center;
      gap: var(--space-1);
      padding: 0 var(--space-2);
    }
    .window-bar i {
      display: block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      opacity: .25;
    }
    .window-bar i:first-child { opacity: .65; }
    .window-content {
      position: relative;
      width: 100%;
      height: calc(100% - var(--window-bar-height));
      overflow: hidden;
      border-radius: 12px 12px 16px 16px;
      background: var(--interface-bg);
    }
    .screenshot {
      position: absolute;
      top: 0;
      left: 0;
      display: block;
      max-width: none;
    }
    .topic-art {
      top: 176px;
      width: 364px;
      height: 364px;
      display: grid;
      place-items: center;
    }
    .topic-art::before, .topic-art::after {
      content: '';
      position: absolute;
      border-radius: 64px;
    }
    .topic-art::before {
      inset: 12px;
      transform: rotate(9deg);
      background: linear-gradient(135deg, var(--glow), var(--tint));
      box-shadow: 0 24px 56px var(--shadow);
    }
    .topic-art::after {
      inset: 0;
      background: linear-gradient(140deg, var(--glass-edge), var(--glass));
      box-shadow: inset 0 0 0 2px var(--glass-edge);
    }
    .topic-svg {
      position: relative;
      z-index: 1;
      width: 276px;
      height: 276px;
      overflow: visible;
      color: var(--accent);
      fill: none;
      stroke: currentColor;
      stroke-width: 7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .icon-tint { fill: var(--tint); }
    .icon-solid { fill: currentColor; stroke: none; }
    .icon-paper { fill: var(--white); }
    .icon-letter {
      fill: currentColor;
      stroke: none;
      font-family: 'Be Vietnam Pro', sans-serif;
      font-weight: 700;
      text-anchor: middle;
    }
    .symbols { position: absolute; width: 0; height: 0; overflow: hidden; }
  </style>
</head>

  </svg>

  <script>
    (() => {
      'use strict';

      const title = document.getElementById('title');
      const subtitle = document.getElementById('subtitle');
      const kicker = document.getElementById('kicker');
      const appWindow = document.getElementById('app-window');
      const windowContent = appWindow.querySelector('.window-content');
      const topicArt = document.getElementById('topic-art');
      const appMark = document.getElementById('app-mark');
      const accents = new Set(['brand', 'writer', 'sheets', 'slides']);
      const icons = new Set([...document.querySelectorAll('symbol')].map(symbol => symbol.id.slice(5)));
      const safe = { left: 64, top: 48, right: 1136, bottom: 582 };
      let queue = Promise.resolve();
      let ready = false;
      let rendering = false;
      let renderError = '';

      function visible(element) {
        return !element.closest('[hidden], defs') && element.getClientRects().length > 0 &&
          getComputedStyle(element).visibility !== 'hidden';
      }

      function textRects(element) {
        const range = document.createRange();
        range.selectNodeContents(element);
        return [...range.getClientRects()].filter(rect => rect.width > 0 && rect.height > 0);
      }

      function lineCount(element) {
        const centers = [];
        const tolerance = parseFloat(getComputedStyle(element).lineHeight) / 2;
        for (const rect of textRects(element)) {
          const center = (rect.top + rect.bottom) / 2;
          if (!centers.some(value => Math.abs(value - center) < tolerance)) centers.push(center);
        }
        return centers.length;
      }

      function clipped(element) {
        return element.scrollHeight > element.clientHeight + 1 ||
          element.scrollWidth > element.clientWidth + 1;
      }

      function setTitle(text) {
        const explicitLines = text.includes('\n');
        title.classList.toggle('explicit-lines', explicitLines);
        if (explicitLines) {
          title.textContent = text;
          return;
        }
        // Keep the final two words together without changing the supplied text.
        const words = [...text.matchAll(/\S+/gu)];
        title.replaceChildren();
        if (words.length < 3) {
          title.textContent = text;
          return;
        }
        const split = words[words.length - 2].index;
        const tail = document.createElement('span');
        tail.className = 'last-words';
        tail.textContent = text.slice(split);
        title.append(document.createTextNode(text.slice(0, split)), tail);
      }

      function fitTitle() {
        const styles = getComputedStyle(document.body);
        const max = parseInt(styles.getPropertyValue('--title-max'), 10);
        const min = parseInt(styles.getPropertyValue('--title-min'), 10);
        for (let size = max; size >= min; size--) {
          title.style.fontSize = `${size}px`;
          if (lineCount(title) <= 2 && !clipped(title)) return;
        }
        throw new Error('Tiêu đề không vừa hai dòng ở cỡ chữ tối thiểu.');
      }

      function waitForImage(img) {
        return new Promise((resolve, reject) => {
          const cleanup = () => {
            img.removeEventListener('load', loaded);
            img.removeEventListener('error', failed);
          };
          const failed = () => {
            cleanup();
            reject(new Error(`Không tải được ảnh: ${img.getAttribute('src')}`));
          };
          const loaded = () => {
            cleanup();
            if (!img.naturalWidth || !img.naturalHeight) return failed();
            img.decode().then(resolve, failed);
          };
          img.addEventListener('load', loaded, { once: true });
          img.addEventListener('error', failed, { once: true });
          if (img.complete) loaded();
        });
      }

      function validate(data) {
        if (!data || typeof data !== 'object') throw new Error('Thiếu dữ liệu trang.');
        for (const key of ['slug', 'kicker', 'title', 'subtitle']) {
          if (typeof data[key] !== 'string' || !data[key].trim()) {
            throw new Error(`Thiếu nội dung: ${key}`);
          }
        }
        if (data.title.split(/\r\n?|\n/).length > 2) throw new Error('Tiêu đề vượt quá hai dòng chủ động.');
        if (!accents.has(data.accent)) throw new Error(`Màu nhấn không hợp lệ: ${data.accent}`);
        const hasScreenshot = data.screenshot !== undefined;
        const hasIcon = data.icon !== undefined;
        if (hasScreenshot === hasIcon) throw new Error('Cần đúng một screenshot hoặc icon.');
        if (hasIcon && !icons.has(data.icon)) throw new Error(`Biểu tượng không hỗ trợ: ${data.icon}`);
        if (hasScreenshot && (typeof data.screenshot !== 'string' ||
          !/^(assets|huong-dan)\/(?:[a-zA-Z0-9_-]+\/)*[a-zA-Z0-9_.-]+\.(png|jpe?g|webp)$/i.test(data.screenshot))) {
          throw new Error('Ảnh phải là đường dẫn cục bộ từ gốc website.');
        }
        if (data.focus !== undefined && (!Array.isArray(data.focus) || data.focus.length !== 3 ||
          !data.focus.every(Number.isFinite) || data.focus[0] < 0 || data.focus[1] < 0 || data.focus[2] <= 0)) {
          throw new Error('Focus phải là [x, y, zoom], với x, y không âm và zoom lớn hơn 0.');
        }
      }

      async function render(data) {
        validate(data);
        ready = false;
        rendering = true;
        renderError = '';
        try {
          document.body.dataset.accent = data.accent;
          document.body.dataset.slug = data.slug;
          const titleText = data.title.replace(/\r\n?/g, '\n');
          const plainTitle = titleText.replace(/\n/g, ' ');
          document.title = `${plainTitle} · HST Office`;
          kicker.textContent = data.kicker;
          setTitle(titleText);
          subtitle.textContent = data.subtitle;

          windowContent.replaceChildren();
          appMark.replaceChildren();
          appWindow.hidden = !data.screenshot;
          topicArt.hidden = !data.icon;
          appMark.hidden = data.accent === 'brand';

          if (data.screenshot) {
            const img = new Image();
            img.className = 'screenshot';
            img.alt = plainTitle;
            img.src = `../../${data.screenshot}`;
            windowContent.append(img);
          } else {
            document.getElementById('topic-use').setAttribute('href', `#icon-${data.icon}`);
          }
          if (data.accent !== 'brand') {
            const img = new Image();
            img.alt = `HST ${data.accent[0].toUpperCase()}${data.accent.slice(1)}`;
            img.setAttribute('data-safe-logo', '');
            img.src = `../../assets/img/hst-${data.accent}-128.png`;
            appMark.append(img);
          }

          await Promise.all([
            ...[...document.images].map(waitForImage),
            document.fonts.load('800 68px "Be Vietnam Pro"', data.title),
            document.fonts.load('700 26px "Be Vietnam Pro"', `${data.kicker.toLocaleUpperCase('vi')} Ấa fx Ctrl CSV 0123 office.hasontech.vn HASON TECH`),
            document.fonts.load('400 26px "Be Vietnam Pro"', `${data.subtitle} Sản phẩm của`)
          ]);
          await document.fonts.ready;
          if (data.screenshot) {
            const img = windowContent.querySelector('img');
            const [x, y, zoom] = data.focus ?? [0, 0, 1];
            // Source coordinates are scaled by the same zoom as the image itself.
            img.style.width = `${img.naturalWidth * zoom}px`;
            img.style.height = `${img.naturalHeight * zoom}px`;
            img.style.left = `${-x * zoom}px`;
            img.style.top = `${-y * zoom}px`;
          }
          fitTitle();
          // Layout reads above are synchronous; one frame also settles SVG <use> geometry.
          await new Promise(resolve => requestAnimationFrame(resolve));
          ready = true;
        } catch (error) {
          renderError = error.message;
          throw error;
        } finally {
          rendering = false;
        }
      }

      // Serialize calls so one thumbnail cannot change while another is still loading.
      window.renderOg = data => {
        const snapshot = data && { ...data };
        if (snapshot && Array.isArray(snapshot.focus)) snapshot.focus = [...snapshot.focus];
        const result = queue.catch(() => {}).then(() => render(snapshot));
        queue = result;
        return result;
      };

      window.ogCheck = () => {
        const problems = [];
        const add = message => { if (!problems.includes(message)) problems.push(message); };
        const inside = rect => rect.left >= safe.left - .5 && rect.top >= safe.top - .5 &&
          rect.right <= safe.right + .5 && rect.bottom <= safe.bottom + .5;
        const overlaps = (a, b) => a.left < b.right - .5 && a.right > b.left + .5 &&
          a.top < b.bottom - .5 && a.bottom > b.top + .5;
        const protectedRects = [];

        if (!ready || rendering) add('Trang chưa render xong.');
        if (renderError) add(renderError);
        if (document.fonts.status !== 'loaded') add('Font chưa tải xong.');
        const body = document.body.getBoundingClientRect();
        if (body.width !== 1200 || body.height !== 630) add('Kích thước body phải là 1200 × 630.');
        if (document.documentElement.scrollWidth > 1200 || document.documentElement.scrollHeight > 630 ||
          getComputedStyle(document.body).overflow !== 'hidden') add('Canvas bị cuộn hoặc tràn.');

        const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
        while (walker.nextNode()) {
          const node = walker.currentNode;
          const element = node.parentElement;
          if (!node.textContent.trim() || !element || element.closest('script, style, svg') || !visible(element)) continue;
          const label = node.textContent.trim();
          const range = document.createRange();
          range.selectNodeContents(node);
          for (const rect of range.getClientRects()) {
            if (!rect.width || !rect.height) continue;
            if (!inside(rect)) add(`Chữ ngoài vùng an toàn: ${label}`);
            protectedRects.push({ rect, label });
          }
          if (clipped(element)) add(`Chữ bị cắt: ${label}`);
        }
        for (const element of document.querySelectorAll('[data-safe-logo], [data-safe-icon]')) {
          if (!visible(element)) continue;
          const rect = element.getBoundingClientRect();
          const label = element.getAttribute('alt') || 'Biểu tượng chủ đề (gồm chữ SVG)';
          if (!inside(rect)) add(`Logo hoặc chữ SVG ngoài vùng an toàn: ${label}`);
          if (element.hasAttribute('data-safe-logo')) protectedRects.push({ rect, label });
        }
        for (const [element, label] of [[title, 'Tiêu đề'], [subtitle, 'Mô tả phụ']]) {
          if (lineCount(element) > 2) add(`${label} vượt quá hai dòng.`);
          if (clipped(element)) add(`${label} bị cắt.`);
        }
        for (const img of document.images) {
          if (!img.complete || !img.naturalWidth) add(`Ảnh chưa tải hoặc lỗi: ${img.getAttribute('src')}`);
        }
        for (const art of document.querySelectorAll('[data-illustration]')) {
          if (!visible(art)) continue;
          const bounds = art.getBoundingClientRect();
          for (const { rect, label } of protectedRects) {
            if (overlaps(bounds, rect)) add(`Minh hoạ đè lên chữ hoặc logo: ${label}`);
          }
        }
        return { ok: problems.length === 0, problems };
      };

      // A real homepage preview also works when this file is opened directly.
      window.renderOg({
        slug: 'trang-chu', accent: 'brand',
        kicker: kicker.textContent, title: title.textContent, subtitle: subtitle.textContent,
        screenshot: 'assets/img/office-tabs-740.jpg'
      }).catch(error => console.error(error));
    })();
  </script>
