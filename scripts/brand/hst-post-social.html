<!doctype html>
<!-- SPDX-License-Identifier: AGPL-3.0-only -->
<html lang="vi">
<meta charset="utf-8">
<title>HST Post · Social artwork source</title>
<style>
@font-face { font-family: BeVietnam; src: url('$regular'); font-weight: 400; }
@font-face { font-family: BeVietnam; src: url('$semibold'); font-weight: 600; }
@font-face { font-family: BeVietnam; src: url('$bold'); font-weight: 700; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1200px; height: 630px; }
body { font-family: BeVietnam, sans-serif; color: #25364a; background: #fff; }
.art { width: 1200px; height: 630px; position: relative; overflow: hidden; }
.wash { position: absolute; left: 704px; top: 134px; width: 650px; height: 380px; border-radius: 190px; background: $tint; }
.edge { position: absolute; width: 7px; height: 96px; top: 260px; border-radius: 0 5px 5px 0; background: $accent; }
.logo { position: absolute; left: 80px; top: 48px; width: 164px; height: 136px; object-fit: contain; }
h1 { position: absolute; left: 80px; top: 226px; margin: 0; font-size: 54px; line-height: 1.24; letter-spacing: -1.8px; font-weight: 700; }
h1 span { display: block; }
h1 .emphasis { color: $ink; }
.subline { position: absolute; left: 80px; top: 396px; margin: 0; font-size: 23px; line-height: 35px; }
.subline span { display: block; }
.network { position: absolute; left: 704px; top: 162px; width: 416px; height: 356px; overflow: visible; }
.divider { position: absolute; left: 80px; right: 80px; bottom: 80px; height: 1px; background: $soft; }
footer { position: absolute; left: 80px; right: 80px; bottom: 40px; display: flex; justify-content: space-between; align-items: center; }
.owner { font-size: 18px; line-height: 26px; letter-spacing: 2.4px; font-weight: 700; color: #322e2e; }
.url { font-size: 19px; line-height: 26px; font-weight: 600; color: $ink; }
.square, .square .art { height: 1200px; }
.square .logo { top: 76px; width: 205px; height: 170px; }
.square h1 { top: 282px; font-size: 76px; line-height: 1.2; letter-spacing: -2.4px; }
.square .subline { top: 495px; font-size: 29px; line-height: 42px; }
.square .wash { left: 200px; top: 648px; width: 1040px; height: 370px; }
.square .edge { top: 330px; height: 140px; }
.square .network { left: 360px; top: 650px; width: 448px; height: 383.38px; }
.square .divider { bottom: 115px; }
.square footer { bottom: 65px; }
.square .owner, .square .url { font-size: 24px; line-height: 32px; }
</style>
<body class="$layout">
<article class="art" aria-label="HST Post — Đăng bài đa nền tảng bằng AI. Dùng ngay tại post.hasontech.vn.">
  <div class="wash"></div><div class="edge"></div>
  <img class="logo safe" src="$logo" alt="HST POST">
  <h1><span class="safe">Đăng bài đa nền tảng</span><span class="safe emphasis">bằng AI</span></h1>
  <p class="subline"><span class="safe">Công cụ đăng bài bằng AI trên hàng loạt</span><span class="safe">nền tảng mạng xã hội.</span></p>
  <!-- Original generic glyphs: conversation, gallery, feed and community. -->
  <svg class="network safe" viewBox="0 0 416 356" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Một bài viết được phân phối tới nhiều nền tảng mạng xã hội">
    <defs>
      <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M1 1 7 4 1 7" fill="none" stroke="$accent" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>
    <g fill="none" stroke="$muted" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M176 178 C245 178 260 34 334 34"/>
      <path d="M176 178 C247 178 264 130 334 130"/>
      <path d="M176 178 C247 178 264 226 334 226"/>
      <path d="M176 178 C245 178 260 322 334 322"/>
    </g>
    <rect x="3" y="86" width="180" height="206" rx="22" fill="$soft" opacity=".55"/>
    <rect x="0" y="78" width="180" height="206" rx="22" fill="#fff" stroke="$line" stroke-width="1.5"/>
    <rect x="20" y="99" width="26" height="26" rx="8" fill="$accent"/>
    <path d="m27 112 5 5 9-11" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="safe" x="56" y="119" font-size="18" font-weight="600" fill="#25364a">Bài viết</text>
    <rect x="20" y="143" width="140" height="70" rx="10" fill="$tint"/>
    <circle cx="131" cy="160" r="7" fill="$muted"/>
    <path d="m31 200 34-38 25 28 18-18 41 28Z" fill="$line"/>
    <path d="M22 235H151 M22 250H116" stroke="$muted" stroke-width="5" stroke-linecap="round"/>
    <g fill="#fff" stroke="$line" stroke-width="1.5">
      <rect x="342" y="0" width="74" height="68" rx="18"/>
      <rect x="342" y="96" width="74" height="68" rx="18"/>
      <rect x="342" y="192" width="74" height="68" rx="18"/>
      <rect x="342" y="288" width="74" height="68" rx="18"/>
    </g>
    <g fill="none" stroke="$accent" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">
      <path d="M367 20h24a4 4 0 0 1 4 4v16a4 4 0 0 1-4 4h-17l-10 7V24a4 4 0 0 1 3-4Z"/>
      <path d="M371 30h17M371 36h11"/>
      <rect x="363" y="115" width="32" height="30" rx="4"/>
      <path d="m365 142 10-12 8 8 5-5 6 8"/><circle cx="386" cy="123" r="2"/>
      <rect x="363" y="211" width="12" height="30" rx="3"/>
      <path d="M383 214h12M383 222h12M383 230h9M383 238h9"/>
      <circle cx="379" cy="308" r="6"/><circle cx="365" cy="333" r="6"/><circle cx="393" cy="333" r="6"/>
      <path d="m376 314-7 13m13-13 7 13m-18 6h16"/>
    </g>
  </svg>
  <div class="divider"></div>
  <footer><span class="owner safe">HASON TECH</span><span class="url safe">Dùng ngay tại post.hasontech.vn</span></footer>
</article>
</body>
</html>
