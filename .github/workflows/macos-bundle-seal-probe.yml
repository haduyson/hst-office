# SPDX-License-Identifier: AGPL-3.0-only
name: macOS bundle seal probe
# Runs an ordinary session (Writer, HST ▸ Kiểm tra cập nhật…, the Văn bản hành chính wizard, quit) of a macOS dmg
# copied to a user-writable folder and checks that the office left its own bundle unchanged and that
# `codesign --verify --deep --strict` still passes (scripts/macos/bundle-seal-probe.sh). Fails when it does not;
# baseline "informational" only records the as-shipped result (for dmgs built before the fix).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag whose arm64 dmg is probed (used when run_id is empty)'
        type: string
        default: v1.0.0-beta.4
      run_id:
        description: 'Desktop macOS run id whose dmg artifact is probed (overrides tag)'
        type: string
        default: ''
      baseline:
        description: 'required: the as-shipped session must leave the bundle unchanged; informational: only record it'
        type: choice
        options: [required, informational]
        default: required
permissions:
  contents: read
concurrency:
  group: macos-bundle-seal-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download the dmg
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/dmg"
          if [ -n "$RUN_ID" ]; then
            [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "bad run id" >&2; exit 1; }
            gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern '*macos*arm64*' --dir "$RUNNER_TEMP/dmg"
          else
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'HSTOffice_*_macOS_arm64.dmg' --dir "$RUNNER_TEMP/dmg"
          fi
          find "$RUNNER_TEMP/dmg" -name '*.dmg'
      - name: Probe the bundle seal
        shell: bash
        env:
          BASELINE: ${{ inputs.baseline }}
        run: |
          set -eu
          dmg=$(find "$RUNNER_TEMP/dmg" -name '*.dmg' -print -quit)
          bash scripts/macos/bundle-seal-probe.sh "$dmg" "$RUNNER_TEMP/seal" "$BASELINE"
      - name: Summarize
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/seal/summary.md" ]; then
            cat "$RUNNER_TEMP/seal/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload probe evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-bundle-seal-probe-${{ github.run_id }}
          path: ${{ runner.temp }}/seal/
          if-no-files-found: error
          retention-days: 7
