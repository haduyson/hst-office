# SPDX-License-Identifier: AGPL-3.0-only
name: Quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pinned quality dependencies
        shell: bash
        run: |
          test -f requirements-templates.lock
          python -m pip install --require-hashes -r requirements-templates.lock
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fonts-liberation
      - name: Run repository quality checks
        shell: bash
        run: |
          mkdir -p build/ci
          bash scripts/ci-quality.sh 2>&1 | tee build/ci/quality.log
      - name: Preserve quality log
        if: ${{ always() && hashFiles('build/ci/quality.log') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-${{ github.sha }}
          path: build/ci/quality.log
          if-no-files-found: error
          retention-days: 7
