# SPDX-License-Identifier: AGPL-3.0-only
name: R1 tự động Windows
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Mã lần dựng desktop-windows có bộ cài cần kiểm tra'
        type: string
        required: true
      items:
        description: 'Các mục cần chạy, ví dụ W3-W5,W12; để trống chạy tất cả'
        type: string
        default: ''
      page_heap:
        description: 'probe: full page heap for soffice.bin'
        type: boolean
        default: false
permissions:
  contents: read
env:
  # Vietnamese evidence must print on Windows' cp1252 console too.
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
concurrency:
  group: r1-auto-windows-${{ inputs.run_id }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  r1:
    permissions:
      contents: read
      actions: read
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        scale: [100]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Khởi tạo kết quả trước khi tải bộ cài
        shell: bash
        env:
          R1_RUN_ID: ${{ inputs.run_id }}
          R1_ITEMS: ${{ inputs.items }}
        run: |
          set -euo pipefail
          python tests/runtime/r1auto/report.py init --platform windows --run-id "$R1_RUN_ID" \
            --items "$R1_ITEMS" --out "$RUNNER_TEMP/r1-evidence"
      - name: Cài công cụ kiểm tra
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r tests/runtime/r1auto/requirements.txt pywinauto==0.6.9
          pwsh -NoProfile -File tests/runtime/r1auto/windows-tools.ps1
      - name: Kiểm tra nguồn bản dựng và tải MSI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$RUNNER_TEMP/source-run.json"
          python tests/runtime/r1auto/verify-source.py "$RUNNER_TEMP/source-run.json" windows
          bash scripts/windows/download-smoke-msi.sh "$RUNNER_TEMP/msi" HST_MSI
      - name: Bật minidump của Windows cho soffice.bin
        shell: bash
        run: |
          set -euo pipefail
          dumps="$(cygpath -w "$RUNNER_TEMP/r1-evidence/crash")"
          mkdir -p "$RUNNER_TEMP/r1-evidence/crash"
          key='HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\soffice.bin'
          MSYS2_ARG_CONV_EXCL='*' reg.exe add "$key" /v DumpFolder /t REG_EXPAND_SZ /d "$dumps" /f
          MSYS2_ARG_CONV_EXCL='*' reg.exe add "$key" /v DumpType /t REG_DWORD /d 1 /f
          MSYS2_ARG_CONV_EXCL='*' reg.exe add "$key" /v DumpCount /t REG_DWORD /d 5 /f
      - name: Probe - attach ProcDump to every soffice.bin
        shell: pwsh
        env:
          PAGE_HEAP: ${{ inputs.page_heap }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pd = Join-Path $env:RUNNER_TEMP 'procdump'
          Invoke-WebRequest https://download.sysinternals.com/files/Procdump.zip -OutFile "$pd.zip"
          Expand-Archive "$pd.zip" -DestinationPath $pd
          $dumps = Join-Path $env:RUNNER_TEMP 'r1-evidence\crash'
          if ($env:PAGE_HEAP -eq 'true') {
            $ifeo = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\soffice.bin'
            New-Item -Path $ifeo -Force | Out-Null
            New-ItemProperty -Path $ifeo -Name GlobalFlag -PropertyType DWord -Value 0x02000000 -Force | Out-Null
            New-ItemProperty -Path $ifeo -Name PageHeapFlags -PropertyType DWord -Value 0x3 -Force | Out-Null
            'full page heap on for soffice.bin'
          }
          $w = Start-Process pwsh -ArgumentList @('-NoProfile', '-File', "$env:GITHUB_WORKSPACE\scripts\windows\probe-attach-procdump.ps1",
            '-ProcDump', "$pd\procdump64.exe", '-Dumps', $dumps) -WindowStyle Hidden -PassThru
          "watcher $($w.Id)"
          "PROBE_WATCHER=$($w.Id)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Chạy checklist trên bản đã cài
        shell: bash
        env:
          R1_RUN_ID: ${{ inputs.run_id }}
          R1_ITEMS: ${{ inputs.items }}
          R1_SCALE: ${{ matrix.scale }}
        run: |
          set -euo pipefail
          python tests/runtime/r1auto/run.py --platform windows --run-id "$R1_RUN_ID" \
            --items "$R1_ITEMS" --package "$HST_MSI" --scale "$R1_SCALE" \
            --out "$RUNNER_TEMP/r1-evidence" --work "$RUNNER_TEMP/r1-work"
      - name: Dừng tiến trình của lượt kiểm tra
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          python tests/runtime/r1auto/cleanup.py "$RUNNER_TEMP/r1-work" "$RUNNER_TEMP/r1-evidence"
      - name: Probe - stop the ProcDump watcher
        if: ${{ always() }}
        shell: pwsh
        run: |
          if ($env:PROBE_WATCHER) { Stop-Process -Id $env:PROBE_WATCHER -ErrorAction SilentlyContinue }
          Get-Process procdump64 -ErrorAction SilentlyContinue | Stop-Process -ErrorAction SilentlyContinue
          Get-ChildItem (Join-Path $env:RUNNER_TEMP 'r1-evidence\crash') | Format-Table Name, Length
      - name: Ghi các lần office đóng đột ngột
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          pwsh -NoProfile -File scripts/windows/print-office-crashes.ps1 -Install 'C:\Program Files\HSTOffice' \
            -Dumps "$(cygpath -w "$RUNNER_TEMP/r1-evidence/crash")" > "$RUNNER_TEMP/r1-evidence/crash/office-crashes.log" 2>&1 \
            || echo "không đọc được báo cáo crash" >> "$RUNNER_TEMP/r1-evidence/crash/office-crashes.log"
      - name: Ghi tóm tắt từng mục
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          python tests/runtime/r1auto/report.py summary --out "$RUNNER_TEMP/r1-evidence"
      - name: Lưu kết quả và ảnh
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r1-windows-${{ inputs.run_id }}-${{ matrix.scale }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/r1-evidence/results.json
            ${{ runner.temp }}/r1-evidence/summary.md
            ${{ runner.temp }}/r1-evidence/**/*.png
            ${{ runner.temp }}/r1-evidence/**/*.pdf
            ${{ runner.temp }}/r1-evidence/**/*.log
            ${{ runner.temp }}/r1-evidence/**/*.dmp
            ${{ runner.temp }}/source-run.json
          if-no-files-found: error
          retention-days: 14
