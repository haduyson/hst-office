# SPDX-License-Identifier: AGPL-3.0-only
name: R1 tự động Windows
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Mã lần dựng desktop-windows có bộ cài cần kiểm tra'
        type: string
        required: true
      items:
        description: 'Các mục cần chạy, ví dụ W3-W5,W12; để trống chạy tất cả'
        type: string
        default: ''
      overlay_extension:
        description: 'Thay extension HST đi kèm bằng bản dựng từ commit này (thử bản sửa không cần dựng lại bộ cài)'
        type: boolean
        default: false
permissions:
  contents: read
env:
  # Vietnamese evidence must print on Windows' cp1252 console too.
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
concurrency:
  group: r1-auto-windows-${{ inputs.run_id }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  r1:
    permissions:
      contents: read
      actions: read
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        scale: [100, 150]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Khởi tạo kết quả trước khi tải bộ cài
        shell: bash
        env:
          R1_RUN_ID: ${{ inputs.run_id }}
          R1_ITEMS: ${{ inputs.items }}
        run: |
          set -euo pipefail
          python tests/runtime/r1auto/report.py init --platform windows --run-id "$R1_RUN_ID" \
            --items "$R1_ITEMS" --out "$RUNNER_TEMP/r1-evidence"
      - name: Cài công cụ kiểm tra
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r tests/runtime/r1auto/requirements.txt pywinauto==0.6.9
          pwsh -NoProfile -File tests/runtime/r1auto/windows-tools.ps1
      - name: Kiểm tra nguồn bản dựng và tải MSI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$RUNNER_TEMP/source-run.json"
          python tests/runtime/r1auto/verify-source.py "$RUNNER_TEMP/source-run.json" windows
          # the release the build was made from (VERSION at its commit): what About must show
          sha=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['head_sha'])" "$RUNNER_TEMP/source-run.json")
          release=$(gh api "repos/$GITHUB_REPOSITORY/contents/VERSION?ref=$sha" --jq .content | base64 -d | tr -d '[:space:]')
          [[ "$release" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]
          echo "R1_RELEASE=$release" >> "$GITHUB_ENV"
          bash scripts/windows/download-smoke-msi.sh "$RUNNER_TEMP/msi" HST_MSI
      - name: Dựng extension từ commit này để thay bản đi kèm
        if: ${{ inputs.overlay_extension }}
        shell: bash
        run: |
          set -euo pipefail
          python -I scripts/build-extensions.py --output "$RUNNER_TEMP/oxt"
          echo "R1_OVERLAY_OXT=$(cygpath -w "$RUNNER_TEMP/oxt/hst-vietnamese-tools.oxt")" >> "$GITHUB_ENV"
      - name: Bật minidump của Windows cho soffice.bin
        shell: bash
        run: |
          set -euo pipefail
          dumps="$(cygpath -w "$RUNNER_TEMP/r1-evidence/crash")"
          mkdir -p "$RUNNER_TEMP/r1-evidence/crash"
          key='HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\soffice.bin'
          MSYS2_ARG_CONV_EXCL='*' reg.exe add "$key" /v DumpFolder /t REG_EXPAND_SZ /d "$dumps" /f
          MSYS2_ARG_CONV_EXCL='*' reg.exe add "$key" /v DumpType /t REG_DWORD /d 1 /f
          MSYS2_ARG_CONV_EXCL='*' reg.exe add "$key" /v DumpCount /t REG_DWORD /d 5 /f
      - name: Chạy checklist trên bản đã cài
        shell: bash
        env:
          R1_RUN_ID: ${{ inputs.run_id }}
          R1_ITEMS: ${{ inputs.items }}
          R1_SCALE: ${{ matrix.scale }}
        run: |
          set -euo pipefail
          python tests/runtime/r1auto/run.py --platform windows --run-id "$R1_RUN_ID" \
            --items "$R1_ITEMS" --package "$HST_MSI" --scale "$R1_SCALE" \
            --out "$RUNNER_TEMP/r1-evidence" --work "$RUNNER_TEMP/r1-work"
      - name: Dừng tiến trình của lượt kiểm tra
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          python tests/runtime/r1auto/cleanup.py "$RUNNER_TEMP/r1-work" "$RUNNER_TEMP/r1-evidence"
      - name: Ghi các lần office đóng đột ngột
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          pwsh -NoProfile -File scripts/windows/print-office-crashes.ps1 -Install 'C:\Program Files\HSTOffice' \
            -Dumps "$(cygpath -w "$RUNNER_TEMP/r1-evidence/crash")" > "$RUNNER_TEMP/r1-evidence/crash/office-crashes.log" 2>&1 \
            || echo "không đọc được báo cáo crash" >> "$RUNNER_TEMP/r1-evidence/crash/office-crashes.log"
      - name: Ghi tóm tắt từng mục
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          python tests/runtime/r1auto/report.py summary --out "$RUNNER_TEMP/r1-evidence"
      - name: Lưu kết quả và ảnh
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r1-windows-${{ inputs.run_id }}-${{ matrix.scale }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/r1-evidence/results.json
            ${{ runner.temp }}/r1-evidence/summary.md
            ${{ runner.temp }}/r1-evidence/**/*.png
            ${{ runner.temp }}/r1-evidence/**/*.pdf
            ${{ runner.temp }}/r1-evidence/**/*.log
            ${{ runner.temp }}/r1-evidence/W16/*.json
            ${{ runner.temp }}/source-run.json
          if-no-files-found: error
          retention-days: 14
