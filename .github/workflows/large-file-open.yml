# SPDX-License-Identifier: AGPL-3.0-only
name: Large file open
# Open time of large synthetic spreadsheets, documents, presentations and PDFs in the released HST Office next to stock
# LibreOffice of the same engine (scripts/perf/large-file-open.sh). Evidence only.
on:
  workflow_dispatch:
  push:
    branches: [probe/large-file-open]
permissions:
  contents: read
concurrency:
  group: large-file-open-${{ github.ref }}
  cancel-in-progress: true
jobs:
  open:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 340
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows, runner: windows-2022, name: core, variants: 'hst,lo', only: ''}
          - {os: windows, runner: windows-2022, name: split, variants: 'hst-noext,hst-toolbar,lo-tabbed', only: ''}
          - {os: windows, runner: windows-2022, name: calc, variants: 'hst-nothreads,lo-nothreads,hst-save,lo-save',
             only: 'calc-values.xlsx,calc-formulas.xlsx,calc-formulas-other.xlsx,calc-styles.xlsx,calc-sheets.xlsx,calc-formulas-60k.xls'}
          - {os: linux, runner: ubuntu-24.04, name: core, variants: 'hst,lo', only: ''}
    env:
      PYTHONUTF8: '1'
      HST_RELEASE: v1.0.1
      LO_MSI_URL: https://downloadarchive.documentfoundation.org/libreoffice/old/26.8.1.1/win/x86_64/LibreOffice_26.8.1.1_Win_x86-64.msi
      LO_DEB_URL: https://downloadarchive.documentfoundation.org/libreoffice/old/26.8.1.1/deb/x86_64/LibreOffice_26.8.1.1_Linux_x86-64_deb.tar.gz
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Time large-file opens
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OS: ${{ matrix.os }}
          VARIANTS: ${{ matrix.variants }}
          ONLY: ${{ matrix.only }}
        run: bash scripts/perf/large-file-open.sh "$OS" "$RUNNER_TEMP/lfo" "$VARIANTS" "$ONLY"
      - name: Summary
        if: ${{ always() }}
        shell: bash
        run: cat "$RUNNER_TEMP/lfo/summary.md" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: large-file-open-${{ matrix.os }}-${{ matrix.name }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/lfo/*.jsonl
            ${{ runner.temp }}/lfo/*.txt
            ${{ runner.temp }}/lfo/*.md
            ${{ runner.temp }}/lfo/*.png
            ${{ runner.temp }}/lfo/*.log
            ${{ runner.temp }}/lfo/*.sha256
          if-no-files-found: warn
          retention-days: 7
