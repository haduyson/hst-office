name: macOS verify Sheets grid (probe branch)
# Grid of a new HST Sheets document on a macOS GUI runner: the 1.0.4 build of a Desktop macOS run and the published
# 1.0.3 dmg, with the default Skia mode and with SAL_SKIA=raster. Evidence only; nothing is published.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Desktop macOS run id whose signed arm64 dmg is the 1.0.4 build'
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: macos-verify-sheets-grid
  cancel-in-progress: false
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        source: [run, release]
        skia: [default, raster]
        mode: [startcenter]
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Download the dmg
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          SOURCE: ${{ matrix.source }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/dmg"
          if [ "$SOURCE" = run ]; then
            [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "bad run id" >&2; exit 1; }
            gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "hst-office-macos-arm64-dmg-signed-$RUN_ID" --dir "$RUNNER_TEMP/dmg"
          else
            gh release download v1.0.3 --repo "$GITHUB_REPOSITORY" --pattern 'HSTOffice_1.0.3_macOS_arm64.dmg' --dir "$RUNNER_TEMP/dmg"
          fi
          find "$RUNNER_TEMP/dmg" -name '*.dmg'
      - name: Screenshot the Sheets grid
        shell: bash
        env:
          SOURCE: ${{ matrix.source }}
          SKIA: ${{ matrix.skia }}
          MODE: ${{ matrix.mode }}
        run: |
          set -eu
          dmg=$(find "$RUNNER_TEMP/dmg" -name '*.dmg' -print -quit)
          out="$RUNNER_TEMP/sheetsgrid"
          mkdir -p "$out"
          bash scripts/macos/sheets-grid-probe.sh "$dmg" "$out" "$SOURCE-$SKIA-$MODE" "$SKIA" "$MODE" || echo "probe exit $?"
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q pillow
          "$RUNNER_TEMP/venv/bin/python" scripts/macos/sheets-grid-lines.py "$out" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-verify-sheets-grid-${{ matrix.source }}-${{ matrix.skia }}-${{ matrix.mode }}-${{ github.run_id }}
          path: ${{ runner.temp }}/sheetsgrid/
          if-no-files-found: error
          retention-days: 14
