name: macOS verify 1.0.4 save dialog (probe branch)
# Screenshots the "Save Document?" dialog of a Desktop macOS run's arm64 dmg, light and dark, and measures the
# contrast of the Save button label. Evidence only; nothing is published.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Desktop macOS run id whose signed arm64 dmg is probed'
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: macos-verify-1-0-4-save-dialog
  cancel-in-progress: false
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download the signed arm64 dmg
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -eu
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "bad run id" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/dmg"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "hst-office-macos-arm64-dmg-signed-$RUN_ID" --dir "$RUNNER_TEMP/dmg"
      - name: Probe the Save Document dialog
        shell: bash
        run: |
          set -eu
          dmg=$(find "$RUNNER_TEMP/dmg" -name '*.dmg' -print -quit)
          bash scripts/macos/save-dialog-probe.sh "$dmg" "$RUNNER_TEMP/savedialog"
      - name: Summarize
        if: ${{ always() }}
        shell: bash
        run: |
          set -eu
          { echo '```'; cat "$RUNNER_TEMP/savedialog/summary.md" 2>/dev/null || echo "no summary"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-verify-1-0-4-save-dialog-${{ github.run_id }}
          path: ${{ runner.temp }}/savedialog/
          if-no-files-found: error
          retention-days: 14
