# SPDX-License-Identifier: AGPL-3.0-only
name: macOS spell probe
# Lists the spell checking services (Hunspell, Apple) configured for vi-VN in a macOS dmg and what each accepts
# for the same Vietnamese words in NFC and NFD, over UNO on a GUI runner. Evidence only.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag whose arm64 dmg is probed (used when run_id is empty)'
        type: string
        default: v1.0.0-beta.2
      run_id:
        description: 'Desktop macOS run id whose dmg artifact is probed (overrides tag)'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: macos-spell-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download the 1.0.2 and 1.0.3 dmgs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          for tag in v1.0.2 v1.0.3; do
            mkdir -p "$RUNNER_TEMP/dmg/$tag"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern 'HSTOffice_*_macOS_arm64.dmg' --dir "$RUNNER_TEMP/dmg/$tag" \
              || echo "no $tag dmg visible to this token (draft release)"
          done
          find "$RUNNER_TEMP/dmg" -name '*.dmg'
      - name: Click a picture in Writer with the real mouse
        shell: bash
        run: |
          set -eu
          for tag in v1.0.3 v1.0.2; do
            dmg=$(find "$RUNNER_TEMP/dmg/$tag" -name '*.dmg' -print -quit)
            [ -n "$dmg" ] || continue
            bash scripts/macos/image-select-probe.sh "$dmg" "$RUNNER_TEMP/spellprobe" "$tag" || echo "probe $tag exit $?"
          done
          for f in "$RUNNER_TEMP"/spellprobe/v*.json; do echo "$f"; cat "$f"; done | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload probe evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-spell-probe-${{ github.run_id }}
          path: ${{ runner.temp }}/spellprobe/
          if-no-files-found: error
          retention-days: 7
