# SPDX-License-Identifier: AGPL-3.0-only
name: macOS USB token probe
# Runs HST ▸ Thiết lập USB Token… natively on Apple Silicon: the released dmg's signed app with the
# hst-vietnamese-tools extension built from this ref and installed with unopkg into a user profile.
# SoftHSM2 (Homebrew, test tooling only) plays the VNPT-CA driver; scenarios and checks are in
# tests/runtime/check-usb-token-setup-macos.py. Evidence only; nothing is published.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag whose arm64 dmg is probed'
        type: string
        default: v1.0.0-beta.4
  # A workflow that is not on the default branch cannot be dispatched until GitHub has seen it run once;
  # pushes of the probe files on this feature branch register and re-run it.
  push:
    branches: [codex/usb-token]
    paths:
      - .github/workflows/macos-usb-token-probe.yml
      - scripts/macos/usb-token-probe.sh
      - tests/runtime/check-usb-token-setup-macos.py
      - tests/runtime/hst_gui_macos.py
permissions:
  contents: read
concurrency:
  group: macos-usb-token-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download the released dmg
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || 'v1.0.0-beta.4' }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'HSTOffice_*_macOS_arm64.dmg' --pattern SHA256SUMS --dir "$RUNNER_TEMP/release"
          cd "$RUNNER_TEMP/release"
          grep '_macOS_arm64.dmg' SHA256SUMS | shasum -a 256 -c -
      - name: Install test tooling (SoftHSM2, NSS tools, OpenSC pkcs11-tool) and verifier packages
        shell: bash
        run: |
          set -eu
          brew install softhsm nss opensc
          python3 -m venv "$RUNNER_TEMP/verify-venv"
          "$RUNNER_TEMP/verify-venv/bin/pip" install --quiet "lxml==5.3.0" "cryptography==43.0.3"
      - name: Build the extension from this ref
        shell: bash
        run: |
          set -eu
          python3 -I scripts/build-extensions.py --output "$RUNNER_TEMP/oxt"
      - name: Run the USB token setup natively (without and with modutil/certutil on PATH)
        shell: bash
        run: |
          set -eu
          dmg=$(find "$RUNNER_TEMP/release" -name 'HSTOffice_*_macOS_arm64.dmg' -print -quit)
          bash scripts/macos/usb-token-probe.sh "$dmg" "$RUNNER_TEMP/oxt/hst-vietnamese-tools.oxt" \
            "$RUNNER_TEMP/usbwork" "$RUNNER_TEMP/usbprobe" "$RUNNER_TEMP/verify-venv/bin/python3"
      - name: Summarize
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo '## macOS USB token probe'
            for f in "$RUNNER_TEMP"/usbprobe/results-*.json; do
              [ -f "$f" ] || continue
              python3 -I - "$f" <<'PY'
          import json, sys
          for row in json.load(open(sys.argv[1], encoding="utf-8")):
              checks = row.get("checks", {})
              ok = row.get("passed") and all(checks.values())
              print("- **%s / %s**: %s (%d checks)" % (row["scenario"], row["mode"], "PASS" if ok else "FAIL", len(checks)))
              for name, value in checks.items():
                  print("  - %s %s" % ("✅" if value else "❌", name))
              if row.get("error"):
                  print("  - error: `%s`" % row["error"].strip().splitlines()[-1])
          PY
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload probe evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-usb-token-probe-${{ github.run_id }}
          path: ${{ runner.temp }}/usbprobe/
          if-no-files-found: error
          retention-days: 7
