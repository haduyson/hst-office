# SPDX-License-Identifier: AGPL-3.0-only
name: R1 tự động macOS
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Mã lần dựng desktop-macos có DMG arm64 cần kiểm tra'
        type: string
        required: true
      items:
        description: 'Các mục cần chạy, ví dụ M1-M3,M6; để trống chạy tất cả'
        type: string
        default: ''
permissions:
  contents: read
env:
  # Vietnamese evidence must print on Windows' cp1252 console too.
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
concurrency:
  group: r1-auto-macos-${{ inputs.run_id }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  r1:
    permissions:
      contents: read
      actions: read
    runs-on: macos-15
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Khởi tạo kết quả trước khi tải bộ cài
        shell: bash
        env:
          R1_RUN_ID: ${{ inputs.run_id }}
          R1_ITEMS: ${{ inputs.items }}
        run: |
          set -euo pipefail
          python tests/runtime/r1auto/report.py init --platform macos --run-id "$R1_RUN_ID" \
            --items "$R1_ITEMS" --out "$RUNNER_TEMP/r1-evidence"
      - name: Cài công cụ kiểm tra native
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r tests/runtime/r1auto/requirements.txt \
            pyobjc-framework-Cocoa==11.1 pyobjc-framework-Quartz==11.1 \
            pyobjc-framework-ApplicationServices==11.1 pyobjc-framework-CoreServices==11.1 \
            pyobjc-framework-libdispatch==11.1
          brew install poppler
      - name: Kiểm tra nguồn bản dựng và tải DMG
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$RUNNER_TEMP/source-run.json"
          python tests/runtime/r1auto/verify-source.py "$RUNNER_TEMP/source-run.json" macos
          # the release the build was made from (VERSION at its commit): what About must show
          sha=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['head_sha'])" "$RUNNER_TEMP/source-run.json")
          release=$(gh api "repos/$GITHUB_REPOSITORY/contents/VERSION?ref=$sha" --jq .content | base64 -d | tr -d '[:space:]')
          [[ "$release" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]
          echo "R1_RELEASE=$release" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/dmg"
          signed="hst-office-macos-arm64-dmg-signed-$RUN_ID"
          count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --paginate \
            --jq ".artifacts[] | select(.name == \"$signed\" and .expired == false) | .id" | wc -l | tr -d ' ')
          artifact="hst-office-macos-arm64-dmg-$RUN_ID"
          if [ "$count" = 1 ]; then artifact="$signed"; fi
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir "$RUNNER_TEMP/dmg"
          python tests/runtime/r1auto/select-package.py "$RUNNER_TEMP/dmg" .dmg >> "$GITHUB_ENV"
          # Signing runs on main only: a release candidate's dmg is unsigned and skips the Gatekeeper items.
          if [ "$artifact" = "$signed" ]; then echo "R1_SIGNED=true" >> "$GITHUB_ENV"; else echo "R1_SIGNED=false" >> "$GITHUB_ENV"; fi
          branch=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['head_branch'])" "$RUNNER_TEMP/source-run.json")
          echo "R1_SOURCE_BRANCH=$branch" >> "$GITHUB_ENV"
          echo "artifact=$artifact" | tee "$RUNNER_TEMP/r1-evidence/package-signature.log"
      - name: Ghi chữ ký và công chứng của DMG (trước khi gắn quarantine)
        shell: bash
        run: |
          set -uo pipefail
          # Evidence for every dmg; a failure only when a signed dmg does not validate or main's dmg is unsigned.
          log="$RUNNER_TEMP/r1-evidence/package-signature.log"
          rc=0
          spctl -a -t open --context context:primary-signature -vv "$R1_PACKAGE" >> "$log" 2>&1 || rc=$?
          xcrun stapler validate "$R1_PACKAGE" >> "$log" 2>&1 || rc=$?
          mnt="$(mktemp -d)"
          hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$mnt" "$R1_PACKAGE" >/dev/null
          spctl -a -t execute -vv "$mnt/HST Office.app" >> "$log" 2>&1 || rc=$?
          codesign -dv --verbose=2 "$mnt/HST Office.app" 2>&1 | grep -E "Authority|TeamIdentifier|Timestamp|Notarization|flags" >> "$log" || rc=$?
          hdiutil detach "$mnt" >/dev/null
          echo "signed artifact: $R1_SIGNED; source branch: $R1_SOURCE_BRANCH; signature checks exit $rc" >> "$log"
          cat "$log"
          if [ "$R1_SIGNED" = true ] && [ "$rc" -ne 0 ]; then
            echo "::error title=Signed dmg rejected::the Developer ID-signed dmg does not pass Gatekeeper (exit $rc)"
            exit "$rc"
          fi
          if [ "$R1_SIGNED" != true ] && [ "$R1_SOURCE_BRANCH" = main ]; then
            echo "::error title=Unsigned main build::a main build must carry the signed dmg; M1-M3 cannot be skipped"
            exit 1
          fi
          if [ "$R1_SIGNED" != true ]; then
            echo "::notice title=Unsigned dmg::$R1_SOURCE_BRANCH is not main: M1-M3 are skipped as needing a signed build"
          fi
      - name: Ghi quyền TCC và chế độ màn hình của runner
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee "$RUNNER_TEMP/r1-evidence/runner-permissions.log"
          import ApplicationServices as ax, Quartz as q
          d = q.CGMainDisplayID()
          modes = q.CGDisplayCopyAllDisplayModes(d, {"kCGDisplayShowDuplicateLowResolutionModes": True}) or []
          print("accessibility", ax.AXIsProcessTrusted(), "screen_capture", q.CGPreflightScreenCaptureAccess())
          print("modes", sorted({(q.CGDisplayModeGetWidth(m), q.CGDisplayModeGetPixelWidth(m)) for m in modes}))
          PY
      - name: Chạy checklist từ DMG cách ly
        timeout-minutes: 80
        shell: bash
        env:
          R1_RUN_ID: ${{ inputs.run_id }}
          R1_ITEMS: ${{ inputs.items }}
        run: |
          set -euo pipefail
          python tests/runtime/r1auto/run.py --platform macos --run-id "$R1_RUN_ID" \
            --items "$R1_ITEMS" --package "$R1_PACKAGE" --scale 200 \
            --out "$RUNNER_TEMP/r1-evidence" --work "$RUNNER_TEMP/r1-work"
      - name: Dừng tiến trình và tháo DMG
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          python tests/runtime/r1auto/cleanup.py "$RUNNER_TEMP/r1-work" "$RUNNER_TEMP/r1-evidence"
      - name: Ghi tóm tắt từng mục
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          python tests/runtime/r1auto/report.py summary --out "$RUNNER_TEMP/r1-evidence"
      - name: Lưu kết quả và ảnh
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r1-macos-${{ inputs.run_id }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/r1-evidence/results.json
            ${{ runner.temp }}/r1-evidence/summary.md
            ${{ runner.temp }}/r1-evidence/**/*.png
            ${{ runner.temp }}/r1-evidence/**/*.pdf
            ${{ runner.temp }}/r1-evidence/**/*.log
            ${{ runner.temp }}/source-run.json
          if-no-files-found: error
          retention-days: 14
  old-profile:
    # windows-smoke's ui-parity-old-profile on macOS: the PUBLISHED beta.5 dmg run once with the user's default
    # profile, removed, then this build installed over that profile (own runner: r1 needs a clean account).
    permissions:
      contents: read
      actions: read
    runs-on: macos-15
    timeout-minutes: 90
    env:
      BETA5_DMG_URL: https://office.hasontech.vn/tai/1.0.0-beta.5/HSTOffice_1.0.0-beta.5_macOS_arm64.dmg
      BETA5_DMG_SHA256: 0959c057f27abc8838425c5ecdea9b15ce446da7779d34c452ec3127f20db4b2
      # The same bytes on GitHub: the signed arm64 dmg of the beta.5 build (desktop-macos run 42264935810, artifact
      # kept until 2026-11-20); the cache keyed by the sha256 carries it past that date while it is used weekly.
      BETA5_RUN_ID: '42264935810'
      BETA5_ARTIFACT: hst-office-macos-arm64-dmg-signed-42264935810
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Cài công cụ kiểm tra native
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r tests/runtime/r1auto/requirements.txt \
            pyobjc-framework-Cocoa==11.1 pyobjc-framework-Quartz==11.1 \
            pyobjc-framework-ApplicationServices==11.1 pyobjc-framework-CoreServices==11.1
      - name: Lấy DMG beta.5 từ cache
        id: beta5-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/old/beta5.dmg
          key: hst-beta5-dmg-arm64-${{ env.BETA5_DMG_SHA256 }}
      - name: Tải DMG beta.5 đã phát hành (kiểm sha256)
        timeout-minutes: 45
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/macos/fetch-verified-dmg.sh "$RUNNER_TEMP/old/beta5.dmg" "$BETA5_DMG_SHA256" \
            "$BETA5_RUN_ID" "$BETA5_ARTIFACT" "$BETA5_DMG_URL"
      - name: Lưu DMG beta.5 vào cache
        if: ${{ steps.beta5-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/old/beta5.dmg
          key: hst-beta5-dmg-arm64-${{ env.BETA5_DMG_SHA256 }}
      - name: Tải DMG cần kiểm tra
        timeout-minutes: 20
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          mkdir -p "$RUNNER_TEMP/dmg"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$RUNNER_TEMP/source-run.json"
          python tests/runtime/r1auto/verify-source.py "$RUNNER_TEMP/source-run.json" macos
          signed="hst-office-macos-arm64-dmg-signed-$RUN_ID"
          count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --paginate \
            --jq ".artifacts[] | select(.name == \"$signed\" and .expired == false) | .id" | wc -l | tr -d ' ')
          artifact="hst-office-macos-arm64-dmg-$RUN_ID"
          if [ "$count" = 1 ]; then artifact="$signed"; fi
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir "$RUNNER_TEMP/dmg"
          python tests/runtime/r1auto/select-package.py "$RUNNER_TEMP/dmg" .dmg >> "$GITHUB_ENV"
      - name: Cài beta.5, mở một lần, gỡ; cài bản mới trên hồ sơ cũ
        id: old_profile
        timeout-minutes: 40
        shell: bash
        run: |
          set -euo pipefail
          python tests/runtime/r1auto/mac_old_profile.py --old "$RUNNER_TEMP/old/beta5.dmg" --new "$R1_PACKAGE" \
            --out "$RUNNER_TEMP/old-profile"
      - name: Dừng tiến trình HST còn lại
        if: ${{ always() }}
        shell: bash
        run: pkill -f "/Applications/HST Office.app/Contents/MacOS/soffice" || echo "không còn tiến trình HST"
      - name: Lưu kết quả và ảnh
        # Only when the check ran: a failed download step already explains the run, and an empty upload would hide it.
        if: ${{ always() && steps.old_profile.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r1-macos-old-profile-${{ inputs.run_id }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/old-profile/*.json
            ${{ runner.temp }}/old-profile/*.png
            ${{ runner.temp }}/old-profile/*.log
          if-no-files-found: error
          retention-days: 14
