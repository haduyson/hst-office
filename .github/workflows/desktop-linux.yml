# SPDX-License-Identifier: AGPL-3.0-only
name: Desktop Linux deb, rpm, AppImage
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = build the .deb (then repack it as .rpm and AppImage) within the time budget; preflight = setup through fetch only (cheap)'
        type: choice
        options: [full, preflight]
        default: full
permissions:
  contents: read
concurrency:
  group: desktop-linux
  cancel-in-progress: false
jobs:
  linux-deb:
    # ubuntu-latest: 4 vCPU / 16 GiB. The build itself runs in an Ubuntu 22.04 container
    # (scripts/linux/run-in-container.sh): the .deb is linked against glibc 2.35, so it
    # installs on Ubuntu 22.04 and every newer supported distribution.
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      HST_CONTAINER: ubuntu:22.04@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11
      HST_CLANG: '20'
    steps:
      - name: Record job start
        shell: bash
        run: |
          set -eu
          started=$(date +%s)
          echo "HST_JOB_START=$started" >> "$GITHUB_ENV"
          # The runner's second disk (/mnt) has more free space than / and keeps the build off the OS disk.
          echo "HST_WORK=/mnt/hst" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Free disk and create the build directory
        shell: bash
        run: |
          set -eu
          bash scripts/linux/free-runner-disk.sh
      - name: Install Pillow for branding staging
        shell: bash
        run: |
          set -eu
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends python3-pil
      - name: Install build dependencies
        shell: bash
        run: |
          set -eu
          bash scripts/linux/ci-build.sh --deps
      - name: Fetch and verify pinned source tarballs
        shell: bash
        run: |
          set -eu
          start=$(date +%s)
          python3 -I scripts/windows/fetch-sources.py --dest "$HST_WORK/dl"
          printf '{"phase":"fetch-sources","seconds":%d,"status":"ok"}\n' $(( $(date +%s) - start )) >> "$HST_WORK/metrics/phases.jsonl"
      - name: Stage branding
        shell: bash
        run: |
          set -eu
          /usr/bin/python3 -I scripts/stage-branding.py --out "$HST_WORK/branding"
      - name: Extract source
        shell: bash
        run: |
          set -eu
          bash scripts/linux/ci-build.sh --extract
      - name: Apply HST patches
        shell: bash
        run: |
          set -eu
          bash scripts/linux/ci-build.sh --patch
      - name: Configure
        shell: bash
        run: |
          set -eu
          bash scripts/linux/ci-build.sh --configure
      - name: Fetch external sources
        shell: bash
        run: |
          set -eu
          bash scripts/linux/ci-build.sh --fetch
      - name: Build within time budget
        if: ${{ inputs.mode == 'full' }}
        shell: bash
        run: |
          set -eu
          export HST_BUILD_DEADLINE=$(( HST_JOB_START + 330 * 60 ))
          bash scripts/linux/ci-build.sh --build
      - name: Collect .deb packages
        id: package
        if: ${{ inputs.mode == 'full' && success() }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/linux/ci-build.sh --package | tee -a "$GITHUB_STEP_SUMMARY"
          # Same payload, no second build: scripts/linux/make-rpm.py and make-appimage.py (docs/LINUX_PACKAGES.md).
          bash scripts/linux/ci-build.sh --rpm-appimage | tail -8 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check coexistence with the distribution LibreOffice
        if: ${{ inputs.mode == 'full' && success() }}
        shell: bash
        run: |
          set -euo pipefail
          deb=$(find "$HST_WORK/installer" -name '*.deb' -print -quit)
          bash scripts/linux/check-coexistence.sh "$deb" "$HST_WORK/artifacts/coexistence" | tail -40 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Summarize metrics
        if: ${{ always() }}
        shell: bash
        run: |
          set -eu
          python3 -I scripts/windows/summarize-trial.py --work "$HST_WORK" --out "$HST_WORK/artifacts" \
            --title 'Linux deb build metrics' --installer-glob '*.deb' | tee -a "$GITHUB_STEP_SUMMARY"
          df -h / "$HST_WORK" > "$HST_WORK/artifacts/df-end.txt"
      - name: Upload build evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-evidence-${{ github.run_id }}
          path: ${{ env.HST_WORK }}/artifacts/
          if-no-files-found: error
          retention-days: 7
      # .deb, .rpm, .AppImage and SHA256SUMS; the artifact name stays (the release collector looks for it).
      - name: Upload .deb packages
        if: ${{ steps.package.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hst-office-linux-deb-${{ github.run_id }}
          path: ${{ env.HST_WORK }}/installer/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
  sign:
    # Optional GPG signature of the .rpm (rpmsign) and the AppImage (detached .asc). Secrets live only here, behind
    # the "linux-signing" environment; until the owner creates the key and the secrets, the gate reports it and every
    # later step is skipped (the job stays green) and the release ships the unsigned, SHA-256-listed packages.
    # Procedure: docs/LINUX_PACKAGES.md.
    needs: linux-deb
    if: ${{ inputs.mode == 'full' }}
    environment: linux-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check signing secrets
        id: gate
        shell: bash
        env:
          HST_LINUX_GPG_PRIVATE_KEY: ${{ secrets.HST_LINUX_GPG_PRIVATE_KEY }}
        run: |
          set -eu
          bash scripts/linux/sign-linux-packages.sh --enabled >> "$GITHUB_OUTPUT"
      - name: Download unsigned packages
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hst-office-linux-deb-${{ github.run_id }}
          path: ${{ runner.temp }}/packages
      - name: Sign and verify
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        shell: bash
        env:
          HST_LINUX_GPG_PRIVATE_KEY: ${{ secrets.HST_LINUX_GPG_PRIVATE_KEY }}
          HST_LINUX_GPG_PASSPHRASE: ${{ secrets.HST_LINUX_GPG_PASSPHRASE }}
          HST_LINUX_GPG_FINGERPRINT: ${{ vars.HST_LINUX_GPG_FINGERPRINT }}
        run: |
          set -euo pipefail
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends rpm gnupg
          (cd "$RUNNER_TEMP/packages" && sha256sum -c SHA256SUMS)
          bash scripts/linux/sign-linux-packages.sh "$RUNNER_TEMP/packages" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload signed packages
        if: ${{ steps.gate.outputs.enabled == 'true' && success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hst-office-linux-deb-signed-${{ github.run_id }}
          path: ${{ runner.temp }}/packages/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
