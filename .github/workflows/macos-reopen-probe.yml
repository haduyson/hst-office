# SPDX-License-Identifier: AGPL-3.0-only
name: Probe mở lại sau khi chuyển (macOS)
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Mã lần dựng desktop-macos có DMG arm64 cần kiểm tra'
        type: string
        required: true
permissions:
  contents: read
env:
  # Vietnamese evidence must print on Windows' cp1252 console too.
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
concurrency:
  group: macos-reopen-probe-${{ inputs.run_id }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  r1:
    permissions:
      contents: read
      actions: read
    runs-on: macos-15
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Khởi tạo kết quả trước khi tải bộ cài
        shell: bash
        env:
          R1_RUN_ID: ${{ inputs.run_id }}
          R1_ITEMS: M1,M2
        run: |
          set -euo pipefail
          python tests/runtime/r1auto/report.py init --platform macos --run-id "$R1_RUN_ID" \
            --items "$R1_ITEMS" --out "$RUNNER_TEMP/r1-evidence"
      - name: Cài công cụ kiểm tra native
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r tests/runtime/r1auto/requirements.txt \
            pyobjc-framework-Cocoa==11.1 pyobjc-framework-Quartz==11.1 \
            pyobjc-framework-ApplicationServices==11.1 pyobjc-framework-CoreServices==11.1 \
            pyobjc-framework-libdispatch==11.1
          brew install poppler
      - name: Kiểm tra nguồn bản dựng và tải DMG
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$RUNNER_TEMP/source-run.json"
          python tests/runtime/r1auto/verify-source.py "$RUNNER_TEMP/source-run.json" macos
          mkdir -p "$RUNNER_TEMP/dmg"
          signed="hst-office-macos-arm64-dmg-signed-$RUN_ID"
          count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --paginate \
            --jq ".artifacts[] | select(.name == \"$signed\" and .expired == false) | .id" | wc -l | tr -d ' ')
          artifact="hst-office-macos-arm64-dmg-$RUN_ID"
          if [ "$count" = 1 ]; then artifact="$signed"; fi
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir "$RUNNER_TEMP/dmg"
          python tests/runtime/r1auto/select-package.py "$RUNNER_TEMP/dmg" .dmg >> "$GITHUB_ENV"
          echo "artifact=$artifact" | tee "$RUNNER_TEMP/r1-evidence/package-signature.log"
      - name: Ghi chữ ký và công chứng của DMG (trước khi gắn quarantine)
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/r1-evidence/package-signature.log"
          { spctl -a -t open --context context:primary-signature -vv "$R1_PACKAGE" 2>&1
            xcrun stapler validate "$R1_PACKAGE" 2>&1
            mnt="$(mktemp -d)"; hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$mnt" "$R1_PACKAGE" >/dev/null
            spctl -a -t execute -vv "$mnt/HST Office.app" 2>&1
            codesign -dv --verbose=2 "$mnt/HST Office.app" 2>&1 | grep -E "Authority|TeamIdentifier|Timestamp|Notarization|flags"
            hdiutil detach "$mnt" >/dev/null; } >> "$log" 2>&1
          cat "$log"
      - name: Ghi quyền TCC và chế độ màn hình của runner
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee "$RUNNER_TEMP/r1-evidence/runner-permissions.log"
          import ApplicationServices as ax, Quartz as q
          d = q.CGMainDisplayID()
          modes = q.CGDisplayCopyAllDisplayModes(d, {"kCGDisplayShowDuplicateLowResolutionModes": True}) or []
          print("accessibility", ax.AXIsProcessTrusted(), "screen_capture", q.CGPreflightScreenCaptureAccess())
          print("modes", sorted({(q.CGDisplayModeGetWidth(m), q.CGDisplayModeGetPixelWidth(m)) for m in modes}))
          PY
      - name: Probe - nạp mã đã sửa vào office qua PYTHONPATH (không đụng bundle đã ký)
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/reopen-override"; mkdir -p "$dir"
          src=extensions/hst-vietnamese-tools/python/hst_office
          cp tests/runtime/r1auto/reopen_override/sitecustomize.py "$dir/"
          cp "$src/mac_app_location.py" "$dir/fixed_mac_app_location.py"
          cat "$src/update_launch.py" tests/runtime/r1auto/reopen_override/instrument.py.txt > "$dir/fixed_update_launch.py"
          echo "R1_PRODUCT_PYTHONPATH=$dir" >> "$GITHUB_ENV"
      - name: Chạy checklist từ DMG cách ly
        timeout-minutes: 80
        shell: bash
        env:
          R1_RUN_ID: ${{ inputs.run_id }}
          R1_ITEMS: M1,M2
        run: |
          set -euo pipefail
          python tests/runtime/r1auto/run.py --platform macos --run-id "$R1_RUN_ID" \
            --items "$R1_ITEMS" --package "$R1_PACKAGE" --scale 200 \
            --out "$RUNNER_TEMP/r1-evidence" --work "$RUNNER_TEMP/r1-work"
      - name: Dừng tiến trình và tháo DMG
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          python tests/runtime/r1auto/cleanup.py "$RUNNER_TEMP/r1-work" "$RUNNER_TEMP/r1-evidence"
      - name: Probe - log của office và của bước chuyển
        if: ${{ always() }}
        shell: bash
        run: |
          cp ~/hst-reopen-probe.log "$RUNNER_TEMP/r1-evidence/" 2>/dev/null || echo "không có hst-reopen-probe.log"
          cp ~/Library/Caches/HSTOffice/update/move.log "$RUNNER_TEMP/r1-evidence/move-final.log" 2>/dev/null || true
          cat "$RUNNER_TEMP/r1-evidence/hst-reopen-probe.log" "$RUNNER_TEMP/r1-evidence/move-final.log" 2>/dev/null || true
      - name: Probe - terminate() của bản đã phát hành, có và không có SuspendQuickstartVeto
        if: ${{ always() }}
        timeout-minutes: 15
        shell: bash
        run: |
          set -uo pipefail
          mnt="$(mktemp -d)"; hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$mnt" "$R1_PACKAGE" >/dev/null
          mkdir -p "$RUNNER_TEMP/copy"; ditto "$mnt/HST Office.app" "$RUNNER_TEMP/copy/HST Office.app"
          hdiutil detach "$mnt" >/dev/null
          cd tests/runtime/r1auto
          python - "$RUNNER_TEMP/copy/HST Office.app" "$RUNNER_TEMP/reopen-work" "$RUNNER_TEMP/r1-evidence" <<'PY'
          import subprocess, sys
          sys.path.insert(0, ".")
          from launch import interpreter
          python, env = interpreter(sys.argv[1])
          done = subprocess.run([str(python), "mac_reopen_probe.py", *sys.argv[1:4]], env=env, timeout=600)
          print("probe exit", done.returncode)
          PY
          cp "$RUNNER_TEMP/reopen-work/office.log" "$RUNNER_TEMP/r1-evidence/reopen-office.log" 2>/dev/null || true
      - name: Ghi tóm tắt từng mục
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          python tests/runtime/r1auto/report.py summary --out "$RUNNER_TEMP/r1-evidence"
      - name: Lưu kết quả và ảnh
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reopen-probe-${{ inputs.run_id }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/r1-evidence/results.json
            ${{ runner.temp }}/r1-evidence/summary.md
            ${{ runner.temp }}/r1-evidence/**/*.png
            ${{ runner.temp }}/r1-evidence/**/*.pdf
            ${{ runner.temp }}/r1-evidence/**/*.log
            ${{ runner.temp }}/source-run.json
            ${{ runner.temp }}/r1-evidence/*.json
          if-no-files-found: error
          retention-days: 14
