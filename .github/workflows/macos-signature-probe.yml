# SPDX-License-Identifier: AGPL-3.0-only
name: macOS signature probe
# Diagnoses the code signature of a released macOS dmg and checks the ad-hoc re-sign fix
# (scripts/macos/adhoc-sign.sh) without a full build. Evidence only; nothing is published.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag whose arm64 dmg is probed'
        type: string
        default: v1.0.0-beta.2
      sign:
        description: 'Also run the Developer ID sign + notarize path (environment macos-signing, needs approval)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: macos-signature-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download the released arm64 dmg
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/release" "$RUNNER_TEMP/probe"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'HSTOffice_*_macOS_arm64.dmg' --pattern SHA256SUMS --dir "$RUNNER_TEMP/release"
          cd "$RUNNER_TEMP/release"
          grep '_macOS_arm64.dmg' SHA256SUMS | shasum -a 256 -c -
      - name: Probe shipped signature, re-sign ad hoc, verify and convert headless
        shell: bash
        run: |
          set -eu
          dmg=$(find "$RUNNER_TEMP/release" -name 'HSTOffice_*_macOS_arm64.dmg' -print -quit)
          bash scripts/macos/signature-probe.sh "$dmg" "$RUNNER_TEMP/probe"
      - name: Summarize
        if: ${{ always() }}
        shell: bash
        run: |
          set -eu
          { echo '```'; grep -vE '^(Executable|Info.plist|TeamIdentifier|Runtime Version|Hash|CandidateCDHash|CDHash|Authority|Timestamp|Internal)' "$RUNNER_TEMP/probe/signature-probe.txt" | sed -n '1,300p'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload probe evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-signature-probe-${{ github.run_id }}
          path: ${{ runner.temp }}/probe/
          if-no-files-found: error
          retention-days: 7
  sign:
    # The desktop-macos "sign" job end to end on the released app after the ad-hoc fix: Developer ID
    # re-sign, dmg rebuild and signature, notarization, stapling, Gatekeeper checks.
    if: ${{ inputs.sign }}
    environment: macos-signing
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Check signing secrets
        id: gate
        shell: bash
        env:
          MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -eu
          bash scripts/macos/sign-notarize.sh --enabled >> "$GITHUB_OUTPUT"
      - name: Download the released arm64 dmg
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'HSTOffice_*_macOS_arm64.dmg' --pattern SHA256SUMS --dir "$RUNNER_TEMP/release"
          cd "$RUNNER_TEMP/release"
          grep '_macOS_arm64.dmg' SHA256SUMS | shasum -a 256 -c -
      - name: Apply the ad-hoc fix and build the signing kit
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        shell: bash
        run: |
          set -eu
          python -m pip install "dmgbuild==1.6.7" "ds-store==1.3.3" "mac-alias==2.2.3"
          echo "HST_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          HST_PYTHON="$(command -v python)" bash scripts/macos/prepare-signing-probe.sh \
            "$(find "$RUNNER_TEMP/release" -name 'HSTOffice_*_macOS_arm64.dmg' -print -quit)" "$RUNNER_TEMP/prep"
      - name: Import Developer ID certificate into a temporary keychain
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        shell: bash
        env:
          MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -eu
          bash scripts/macos/sign-notarize.sh --import
      - name: Sign, notarize, staple and verify
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        shell: bash
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -eu
          dmg=$(find "$RUNNER_TEMP/prep/adhoc" -name '*.dmg' -print -quit)
          bash scripts/macos/sign-notarize.sh --sign "$dmg" "$RUNNER_TEMP/prep/signing-kit" "$RUNNER_TEMP/signed"
      - name: Delete temporary keychain
        if: ${{ always() }}
        shell: bash
        run: |
          set -eu
          bash scripts/macos/sign-notarize.sh --cleanup
      - name: Upload signed dmg
        if: ${{ steps.gate.outputs.enabled == 'true' && success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-signing-probe-arm64-dmg-signed-${{ github.run_id }}
          path: ${{ runner.temp }}/signed/
          if-no-files-found: error
          retention-days: 3
