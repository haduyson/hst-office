# SPDX-License-Identifier: AGPL-3.0-only
name: Windows VBA form probe
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-vba-form-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Fetch the sample files from the commit that last held them (tests/fixtures/vba-office-probe/README.md)
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 16d044d6642351bdbf60a6216726127f8747f4cc
          mkdir -p "$RUNNER_TEMP/vba-office-probe"
          git archive 16d044d6642351bdbf60a6216726127f8747f4cc tests/fixtures/vba-office-probe | tar -x -C "$RUNNER_TEMP/vba-office-probe" --strip-components=3
      - name: Probe the sample files (no Office on this runner means NOT TESTED, see the script)
        shell: bash
        run: |
          set -euo pipefail
          pwsh -NoProfile -File scripts/windows/probe-excel-userform.ps1 -Samples "$RUNNER_TEMP/vba-office-probe"
      - name: Keep the samples for the human test in real Office
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vba-form-samples
          path: ${{ runner.temp }}/vba-office-probe
          if-no-files-found: error
          retention-days: 14
