# SPDX-License-Identifier: AGPL-3.0-only
# Publishes installers that an earlier successful Windows build produced, as a GitHub Release.
# Nothing is rebuilt here: the installer is taken from that run's artifact, checked against its
# SHA256SUMS and attached on the runner, so users download it from the release without signing in.
name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.0-beta.1"
        required: true
        type: string
      windows_run_id:
        description: "Run id of a successful 'Desktop Windows' full build on main"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: true
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The only job allowed to write: it creates the release and uploads verified files.
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
      RUN_ID: ${{ inputs.windows_run_id }}
      PRERELEASE: ${{ inputs.prerelease }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate inputs and source run
        id: source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "bad tag: $TAG" >&2; exit 1; }
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "bad run id: $RUN_ID" >&2; exit 1; }
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID" \
            --jq '[.path, .head_branch, .status, .conclusion, .head_sha] | @tsv' > run.tsv
          IFS=$'\t' read -r wf branch status conclusion sha < run.tsv
          [ "$wf" = ".github/workflows/desktop-windows.yml" ] || { echo "run $RUN_ID is $wf, not the Windows build" >&2; exit 1; }
          if [ "$branch" != "main" ] || [ "$status" != "completed" ] || [ "$conclusion" != "success" ]; then
            echo "run $RUN_ID must be a successful build on main ($branch $status $conclusion)" >&2; exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then echo "release $TAG already exists" >&2; exit 1; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Download and verify the Windows installer
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" -n "hst-office-windows-msi-$RUN_ID" -D dist/release
          cd dist/release
          sha256sum -c SHA256SUMS
          ls -la
      - name: Create release and attach installer
        shell: bash
        env:
          TARGET: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          notes="docs/releases/$TAG.md"
          [ -f "$notes" ] || { echo "missing release notes: $notes" >&2; exit 1; }
          flags=()
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          gh release create "$TAG" --target "$TARGET" --title "HST Office $TAG" --notes-file "$notes" "${flags[@]}" \
            dist/release/*.msi dist/release/SHA256SUMS
          gh release view "$TAG" --json url,assets --jq '.url, (.assets[] | "\(.name) \(.size)")' | tee -a "$GITHUB_STEP_SUMMARY"
