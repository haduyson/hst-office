# SPDX-License-Identifier: AGPL-3.0-only
# Publishes one GitHub Release with the Windows, Linux and macOS installers of ONE commit on main.
# Nothing is rebuilt here: each installer comes from a successful build run of that commit, is
# checked against its artifact's SHA256SUMS and attached on the runner, so users download it from
# the release without signing in. Run ids are found automatically unless pinned.
name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.0-beta.2"
        required: true
        type: string
      platforms:
        description: "Platforms to include (space-separated)"
        required: true
        type: string
        default: "windows linux macos"
      commit:
        description: "Commit to release (empty: head of the newest successful Windows build)"
        required: false
        type: string
      macos_commit:
        description: "Take macOS dmgs from this later commit (optional; only macOS packaging/CI/docs may differ)"
        required: false
        type: string
      windows_run_id:
        description: "Pin a Windows build run (optional)"
        required: false
        type: string
      linux_run_id:
        description: "Pin a Linux build run (optional)"
        required: false
        type: string
      macos_run_id:
        description: "Pin a macOS build run (optional)"
        required: false
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: true
        type: boolean
        default: true
      append:
        description: "Add platforms to an existing release (same commit), e.g. macOS after Windows/Linux"
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The only job allowed to write: it creates the release and uploads verified files.
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
      PRERELEASE: ${{ inputs.prerelease }}
      APPEND: ${{ inputs.append }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate tag and release notes
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "bad tag: $TAG" >&2; exit 1; }
          [ -f "docs/releases/$TAG.md" ] || { echo "missing release notes: docs/releases/$TAG.md" >&2; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then
            [ "$APPEND" = "true" ] || { echo "release $TAG already exists (use append=true to add platforms)" >&2; exit 1; }
          else
            [ "$APPEND" != "true" ] || { echo "append=true but release $TAG does not exist" >&2; exit 1; }
          fi
      - name: Collect and verify installers from one commit
        id: collect
        shell: bash
        env:
          PLATFORMS: ${{ inputs.platforms }}
          COMMIT: ${{ inputs.commit }}
          WINDOWS_RUN_ID: ${{ inputs.windows_run_id }}
          LINUX_RUN_ID: ${{ inputs.linux_run_id }}
          MACOS_RUN_ID: ${{ inputs.macos_run_id }}
          MACOS_COMMIT: ${{ inputs.macos_commit }}
        run: |
          set -euo pipefail
          if [ "$APPEND" = "true" ]; then
            # Appended installers must come from the commit the release is tagged at.
            COMMIT="$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)"
            export COMMIT
          fi
          bash scripts/release/collect-release-assets.sh dist/release
          cat dist/release/.release-commit >> "$GITHUB_OUTPUT"
      - name: Create or extend the release
        shell: bash
        env:
          TARGET: ${{ steps.collect.outputs.commit }}
          MACOS_TARGET: ${{ steps.collect.outputs.macos_commit }}
        run: |
          set -euo pipefail
          # Record both commits when the macOS dmgs come from a later, macOS-packaging-only commit.
          note=""
          if [ -n "$MACOS_TARGET" ] && [ "$MACOS_TARGET" != "$TARGET" ]; then
            note="Bộ cài macOS được đóng gói từ commit ${MACOS_TARGET} (chỉ khác commit phát hành ${TARGET} ở phần đóng gói macOS, CI và tài liệu)."
            printf -- '- release commit: %s\n- macOS commit: %s\n' "$TARGET" "$MACOS_TARGET" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$APPEND" = "true" ]; then
            # Never replace an installer already published; merge SHA256SUMS by file name.
            existing="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
            for f in dist/release/*; do
              name="$(basename "$f")"
              [ "$name" = SHA256SUMS ] && continue
              if grep -qx "$name" <<<"$existing"; then echo "$name is already in $TAG" >&2; exit 1; fi
            done
            gh release download "$TAG" -p SHA256SUMS -O old-sums
            sort -u -k2,2 dist/release/SHA256SUMS old-sums > merged-sums
            mv merged-sums dist/release/SHA256SUMS
            (cd dist/release && sha256sum -c --ignore-missing SHA256SUMS)
            find dist/release -maxdepth 1 -type f ! -name SHA256SUMS -print0 | xargs -0 gh release upload "$TAG"
            gh release upload "$TAG" dist/release/SHA256SUMS --clobber
            if [ -n "$note" ]; then
              gh release view "$TAG" --json body --jq .body > notes.md
              printf '\n%s\n' "$note" >> notes.md
              gh release edit "$TAG" --notes-file notes.md
            fi
          else
            flags=()
            [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
            cp "docs/releases/$TAG.md" notes.md
            if [ -n "$note" ]; then printf '\n%s\n' "$note" >> notes.md; fi
            gh release create "$TAG" --target "$TARGET" --title "HST Office $TAG" \
              --notes-file notes.md "${flags[@]}" dist/release/*
          fi
          gh release view "$TAG" --json url,assets --jq '.url, (.assets[] | "\(.name) \(.size)")' | tee -a "$GITHUB_STEP_SUMMARY"
