# SPDX-License-Identifier: AGPL-3.0-only
name: macOS save replace probe
# Runs tests/runtime/check-save-replace.py against the dmg of a desktop macOS run: saving over an existing file
# (plain file and symbolic link) goes through a temporary file, fsync and rename and keeps the link, the
# permissions and the Finder info. Headless, manual only.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Desktop macOS run id whose arm64 dmg artifact is checked'
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: macos-save-replace-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download the dmg
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -eu
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "bad run id" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/dmg"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern '*macos*arm64*' --dir "$RUNNER_TEMP/dmg"
          find "$RUNNER_TEMP/dmg" -name '*.dmg'
      - name: Check saving over existing files
        shell: bash
        run: |
          set -eu
          dmg=$(find "$RUNNER_TEMP/dmg" -name '*.dmg' -print -quit)
          [ -n "$dmg" ] || { echo "no dmg in the artifact" >&2; exit 1; }
          mnt="$RUNNER_TEMP/mnt"; out="$RUNNER_TEMP/save-replace"; mkdir -p "$mnt" "$out"
          hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$mnt" "$dmg" >/dev/null
          ditto "$mnt/HST Office.app" "$RUNNER_TEMP/HST Office.app"
          hdiutil detach "$mnt" >/dev/null
          app="$RUNNER_TEMP/HST Office.app"
          [ -x "$app/Contents/Resources/python" ] || { echo "the bundle has no Contents/Resources/python" >&2; exit 1; }
          "$app/Contents/Resources/python" tests/runtime/check-save-replace.py --program "$app/Contents/MacOS" \
            2>&1 | tee "$out/result.txt"
          exit "${PIPESTATUS[0]}"
      - name: Stop leftover office processes
        if: ${{ always() }}
        shell: bash
        run: pkill -f "$RUNNER_TEMP/HST Office.app/Contents/MacOS/soffice" || echo "no HST process left"
      - name: Summarize
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/save-replace/result.txt" ]; then
            { echo '```'; cat "$RUNNER_TEMP/save-replace/result.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload the result
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-save-replace-probe-${{ github.run_id }}
          path: ${{ runner.temp }}/save-replace/
          if-no-files-found: warn
          retention-days: 7
