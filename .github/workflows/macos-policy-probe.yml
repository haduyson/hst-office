# SPDX-License-Identifier: AGPL-3.0-only
name: macOS update-lock probe
# Proves the macOS update-lock templates of the user guide (help/files/*.mobileconfig) on a released dmg: tries to
# install each profile, applies its payload as managed preferences and checks the lock over UNO
# (scripts/macos/update-policy-probe.sh, tests/runtime/check-update-policy.py). Evidence only.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag whose arm64 dmg is probed'
        type: string
        default: v1.0.0-beta.4
permissions:
  contents: read
concurrency:
  group: macos-policy-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download the released arm64 dmg
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/dmg"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'HSTOffice_*_macOS_arm64.dmg' --dir "$RUNNER_TEMP/dmg"
          find "$RUNNER_TEMP/dmg" -name '*.dmg'
      - name: Probe the update-lock templates
        shell: bash
        run: |
          set -eu
          dmg=$(find "$RUNNER_TEMP/dmg" -name '*.dmg' -print -quit)
          bash scripts/macos/update-policy-probe.sh "$dmg" "$RUNNER_TEMP/policy"
      - name: Summarize
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/policy/summary.md" ]; then
            cat "$RUNNER_TEMP/policy/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload probe evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-policy-probe-${{ github.run_id }}
          path: ${{ runner.temp }}/policy/
          if-no-files-found: error
          retention-days: 7
