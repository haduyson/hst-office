# SPDX-License-Identifier: AGPL-3.0-only
name: ND30 type list probe (Windows)
# Hover over the fields covered by the open "Loại văn bản" list of the ND30 wizard: beta.5 as installed, then this
# commit's extension overlaid. Screenshots and geometry only; evidence for a probe branch.
on:
  push:
    branches: [probe/nd30-type-popup-win]
permissions:
  contents: read
concurrency:
  group: nd30-type-list-probe-windows
  cancel-in-progress: true
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      BETA5_MSI_URL: https://office.hasontech.vn/tai/1.0.0-beta.5/HSTOffice_1.0.0-beta.5_Win_x86-64_en-US_vi.msi
      BETA5_MSI_SHA256: 645f605aafc6999e4c29ca5c3f64cf44ffddfd11a06e74b4e0540cf3c1fdf219
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install beta.5
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/msi" "$RUNNER_TEMP/out"
          curl -fsSL -o "$RUNNER_TEMP/msi/beta5.msi" "$BETA5_MSI_URL"
          echo "$BETA5_MSI_SHA256  $RUNNER_TEMP/msi/beta5.msi" | sha256sum -c -
          MSYS2_ARG_CONV_EXCL='*' msiexec.exe /i "$(cygpath -w "$RUNNER_TEMP/msi/beta5.msi")" /qn /norestart /l*v "$(cygpath -w "$RUNNER_TEMP/out/msi.log")"
          soffice="$(find '/c/Program Files' -maxdepth 4 -iname soffice.exe | head -n 1)"
          echo "HST_INSTALL=$(cygpath -w "$(dirname "$(dirname "$soffice")")")" >> "$GITHUB_ENV"
      - name: Probe beta.5 and this commit's extension
        shell: bash
        run: |
          set -uo pipefail
          install="$(cygpath -u "$HST_INSTALL")"
          export PATH="$install/program:$PATH"
          export UNO_PATH="$HST_INSTALL\\program"
          probe() { timeout 600 "$install/program/python.exe" scripts/windows/nd30-type-list-probe.py --install "$HST_INSTALL" --out "$(cygpath -w "$RUNNER_TEMP/out")" --label "$1"; taskkill //F //IM soffice.bin >/dev/null 2>&1; taskkill //F //IM soffice.exe >/dev/null 2>&1; sleep 3; }
          probe beta5
          python -I scripts/build-extensions.py --output "$RUNNER_TEMP/oxt"
          target="$install/share/extensions/hst-vietnamese-tools"
          rm -rf "$target"; mkdir -p "$target"
          python -I -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$RUNNER_TEMP/oxt/hst-vietnamese-tools.oxt" "$target"
          probe checkout
      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nd30-type-list-probe-windows-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/out/
            !${{ runner.temp }}/out/**/profile/**
          retention-days: 7
