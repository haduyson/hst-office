# SPDX-License-Identifier: AGPL-3.0-only
name: macOS tab probe
# Probe branch variant: "open another tab" timing (new-tab-hang-probe.sh) for the 1.0.3 release dmg and a
# desktop macOS run's dmg, on macOS 14 and 15. Evidence only.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag whose arm64 dmg is probed'
        type: string
        default: v1.0.3
      run_id:
        description: 'Desktop macOS run id whose dmg artifact is probed'
        type: string
        default: '45105332888'
      layouts:
        description: 'Probe layouts (fullscreen windowed switch)'
        type: string
        default: 'fullscreen windowed'
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { build: run, adopter: 'on', tips: 'off' }
          - { build: release, adopter: 'on', tips: 'off' }
    runs-on: macos-15
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download the dmg
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          RUN_ID: ${{ inputs.run_id }}
          BUILD: ${{ matrix.build }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/dmg"
          if [ "$BUILD" = run ]; then
            [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "bad run id" >&2; exit 1; }
            gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "hst-office-macos-arm64-dmg-signed-$RUN_ID" --dir "$RUNNER_TEMP/dmg"
          else
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'HSTOffice_*_macOS_arm64.dmg' --dir "$RUNNER_TEMP/dmg"
          fi
          find "$RUNNER_TEMP/dmg" -name '*.dmg'
      - name: Probe opening another tab
        if: ${{ inputs.layouts != 'switch' || (matrix.adopter == 'on' && matrix.tips == 'on') }}
        shell: bash
        env:
          LAYOUTS: ${{ inputs.layouts }}
        run: |
          set -eu
          dmg=$(find "$RUNNER_TEMP/dmg" -name '*.dmg' -print -quit)
          bash scripts/macos/fs-new-tab-probe.sh "$dmg" "$RUNNER_TEMP/newtab" "${{ matrix.adopter }}" "${{ matrix.tips }}"
      - name: Summarize
        if: ${{ always() }}
        shell: bash
        run: |
          { echo "### ${{ matrix.build }} adopter ${{ matrix.adopter }} tips ${{ matrix.tips }}"; cat "$RUNNER_TEMP/newtab/version.txt" 2>/dev/null; cat "$RUNNER_TEMP/newtab/summary.md" 2>/dev/null; } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload probe evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fsnewtab-${{ matrix.build }}-${{ matrix.adopter }}-${{ matrix.tips }}-${{ github.run_id }}
          path: ${{ runner.temp }}/newtab/
          if-no-files-found: error
          retention-days: 7
