# SPDX-License-Identifier: AGPL-3.0-only
name: macOS tab probe
# Times document-tab actions (switch, close, "+" new tab, open file) of a macOS dmg on a GUI runner, windowed
# and in native full screen, with a window sampler, screen recording and screenshots. Evidence only.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag whose arm64 dmg is probed (used when run_id is empty)'
        type: string
        default: v1.0.0-beta.2
      run_id:
        description: 'Desktop macOS run id whose dmg artifact is probed (overrides tag)'
        type: string
        default: ''
      overlay:
        description: 'hst_office modules of this checkout overlaid for a second run (space-separated file names)'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: macos-tab-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download the dmg
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/dmg"
          if [ -n "$RUN_ID" ]; then
            [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "bad run id" >&2; exit 1; }
            # the signed dmg (sign job) is what users install; the unsigned build artifact only when there is none
            if ! gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
                --name "hst-office-macos-arm64-dmg-signed-$RUN_ID" --dir "$RUNNER_TEMP/dmg"; then
              echo "::warning::run $RUN_ID has no signed arm64 dmg: probing the unsigned one"
              gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
                --name "hst-office-macos-arm64-dmg-$RUN_ID" --dir "$RUNNER_TEMP/dmg"
            fi
          else
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'HSTOffice_*_macOS_arm64.dmg' --dir "$RUNNER_TEMP/dmg"
          fi
          find "$RUNNER_TEMP/dmg" -name '*.dmg'
      - name: Probe dialogs in full screen when another document opens
        shell: bash
        env:
          OVERLAY: ${{ inputs.overlay }}
        run: |
          set -eu
          count=$(find "$RUNNER_TEMP/dmg" -name '*.dmg' | wc -l)
          [ "$count" -eq 1 ] || { echo "expected one dmg, found $count" >&2; exit 1; }
          dmg=$(find "$RUNNER_TEMP/dmg" -name '*.dmg')
          echo "probing: $(basename "$dmg")"
          bash scripts/macos/fsdialog-probe.sh "$dmg" "$RUNNER_TEMP/tabprobe/stock" || true
          if [ -n "$OVERLAY" ]; then
            mkdir -p "$RUNNER_TEMP/overlay"
            for name in $OVERLAY; do
              [[ "$name" =~ ^[a-z0-9_]+\.py$ ]] || { echo "bad module name" >&2; exit 1; }
              cp "extensions/hst-vietnamese-tools/python/hst_office/$name" "$RUNNER_TEMP/overlay/"
            done
            bash scripts/macos/fsdialog-probe.sh "$dmg" "$RUNNER_TEMP/tabprobe/overlay" "$RUNNER_TEMP/overlay" || true
          fi
          for v in stock overlay; do
            [ -f "$RUNNER_TEMP/tabprobe/$v/summary.md" ] && { echo "## $v"; cat "$RUNNER_TEMP/tabprobe/$v/summary.md"; }
          done > "$RUNNER_TEMP/tabprobe/summary.md" || true
          touch "$RUNNER_TEMP/tabprobe/none.mov"
      - name: Summarize
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/tabprobe/summary.md" ]; then
            tee -a "$GITHUB_STEP_SUMMARY" < "$RUNNER_TEMP/tabprobe/summary.md"
          fi
      - name: Upload probe evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-tab-probe-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/tabprobe/
            !${{ runner.temp }}/tabprobe/*.mov
          if-no-files-found: error
          retention-days: 7
      - name: Upload screen recordings
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-tab-probe-video-${{ github.run_id }}
          path: ${{ runner.temp }}/tabprobe/*.mov
          if-no-files-found: error
          retention-days: 7
