# SPDX-License-Identifier: AGPL-3.0-only
name: ND30 type list probe (macOS)
# The open "Loại văn bản" list of the ND30 wizard on aqua: beta.5 arm64 dmg as built, then this commit's extension.
on:
  push:
    branches: [probe/nd30-type-popup-mac]
permissions:
  contents: read
concurrency:
  group: nd30-type-list-probe-macos
  cancel-in-progress: true
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download the beta.5 dmg (its Desktop macOS run; the release is a draft)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 42264935810 --repo "$GITHUB_REPOSITORY" --name hst-office-macos-arm64-dmg-42264935810 --dir "$RUNNER_TEMP/dmg"
      - name: Build this commit's extension
        run: python3 -I scripts/build-extensions.py --output "$RUNNER_TEMP/oxt"
      - name: Probe
        run: bash scripts/macos/nd30-type-list-probe.sh "$(find "$RUNNER_TEMP/dmg" -name '*.dmg' -print -quit)" "$RUNNER_TEMP/out" "$RUNNER_TEMP/oxt/hst-vietnamese-tools.oxt"
      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nd30-type-list-probe-macos-${{ github.run_id }}
          path: ${{ runner.temp }}/out/
          retention-days: 7
