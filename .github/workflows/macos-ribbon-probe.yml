# SPDX-License-Identifier: AGPL-3.0-only
name: macOS ribbon probe
# Screenshots the Writer, Sheets and Slides ribbon of a macOS dmg on a GUI runner in light and dark appearance,
# with the shipped defaults and with the ribbon-colour override. Evidence only; nothing is published.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag whose arm64 dmg is probed'
        type: string
        default: v1.0.0-beta.2
      transparency:
        description: 'NotebookbarColorTransparency override (255 = no module tint)'
        type: string
        default: '255'
permissions:
  contents: read
concurrency:
  group: macos-ribbon-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download the released arm64 dmg
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/dmg"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'HSTOffice_*_macOS_arm64.dmg' --dir "$RUNNER_TEMP/dmg"
      - name: Screenshot the ribbons
        shell: bash
        env:
          TRANSPARENCY: ${{ inputs.transparency }}
        run: |
          set -eu
          [[ "$TRANSPARENCY" =~ ^[0-9]+$ ]] || { echo "bad transparency" >&2; exit 1; }
          dmg=$(find "$RUNNER_TEMP/dmg" -name '*.dmg' -print -quit)
          bash scripts/macos/ribbon-probe.sh "$dmg" "$RUNNER_TEMP/ribbon" "$TRANSPARENCY"
      - name: Upload screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-ribbon-probe-${{ github.run_id }}
          path: ${{ runner.temp }}/ribbon/
          if-no-files-found: error
          retention-days: 7
