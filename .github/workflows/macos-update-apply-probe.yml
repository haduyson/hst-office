# SPDX-License-Identifier: AGPL-3.0-only
name: macOS update apply probe
# Diagnosis only: does "Cập nhật ngay" replace /Applications/HST Office.app on macOS with the published dmgs
# (beta.5 -> 1.0.1 with beta.5's own code; 1.0.1's own code; the helper alone). scripts/macos/update-apply-probe.sh
on:
  push:
    branches: [diag/mac-update-apply]
    paths: [scripts/macos/update-apply-probe.*, .github/workflows/macos-update-apply-probe.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: macos-update-apply-probe
  cancel-in-progress: true
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      OLD_SHA256: 0959c057f27abc8838425c5ecdea9b15ce446da7779d34c452ec3127f20db4b2
      NEW_SHA256: 3b1850d681eab4b8b3488c896f0f79b3a4b78c86d7d3dbbd2c370b37685e9642
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Restore beta.5 dmg
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/old/beta5.dmg
          key: hst-beta5-dmg-arm64-${{ env.OLD_SHA256 }}
      - name: Fetch the published dmgs (sha256 checked)
        timeout-minutes: 45
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/macos/fetch-verified-dmg.sh "$RUNNER_TEMP/old/beta5.dmg" "$OLD_SHA256" 42264935810 \
            hst-office-macos-arm64-dmg-signed-42264935810 https://office.hasontech.vn/tai/1.0.0-beta.5/HSTOffice_1.0.0-beta.5_macOS_arm64.dmg
          bash scripts/macos/fetch-verified-dmg.sh "$RUNNER_TEMP/new/HSTOffice_1.0.1_macOS_arm64.dmg" "$NEW_SHA256" 43060602039 \
            hst-office-macos-arm64-dmg-signed-43060602039 https://office.hasontech.vn/tai/1.0.1/HSTOffice_1.0.1_macOS_arm64.dmg
      - name: Probe
        shell: bash
        run: |
          mv "$RUNNER_TEMP/old/beta5.dmg" "$RUNNER_TEMP/old/HSTOffice_1.0.0-beta.5_macOS_arm64.dmg"
          bash scripts/macos/update-apply-probe.sh "$RUNNER_TEMP/old/HSTOffice_1.0.0-beta.5_macOS_arm64.dmg" 1.0.0-beta.5 \
            "$RUNNER_TEMP/new/HSTOffice_1.0.1_macOS_arm64.dmg" 1.0.1 "$RUNNER_TEMP/probe"
      - name: Summarize
        if: ${{ always() }}
        shell: bash
        run: cat "$RUNNER_TEMP/probe/summary.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() }}
        with:
          name: macos-update-apply-probe-${{ github.run_id }}
          path: ${{ runner.temp }}/probe/
          retention-days: 7
