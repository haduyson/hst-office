# SPDX-License-Identifier: AGPL-3.0-only
name: Desktop Windows trial
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-windows
  cancel-in-progress: false
jobs:
  windows-trial:
    # Trial: measures what a standard hosted runner can do; a full build is expected to exceed the job limit.
    runs-on: windows-2022
    timeout-minutes: 355
    env:
      MSYS2_ARG_CONV_EXCL: '*'
      CHERE_INVOKING: '1'
    steps:
      - name: Record job start
        shell: bash
        run: |
          set -eu
          started=$(date +%s)
          echo "HST_JOB_START=$started" >> "$GITHUB_ENV"
      - name: Keep LF line endings (shell scripts and patches must not become CRLF)
        shell: bash
        run: |
          set -eu
          git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Probe runner and free disk
        shell: bash
        run: |
          set -eu
          pwsh -NoProfile -File scripts/build-windows.ps1 -Task Probe
          pwsh -NoProfile -File scripts/build-windows.ps1 -Task FreeDisk
      - name: Install Cygwin and build tools
        shell: bash
        run: |
          set -eu
          mkdir -p /d/hst/logs /d/hst/metrics
          start=$(date +%s)
          pwsh -NoProfile -File scripts/build-windows.ps1 -Task Cygwin -Work 'D:\hst'
          pwsh -NoProfile -File scripts/build-windows.ps1 -Task Tools -Work 'D:\hst'
          printf '{"phase":"setup-tools","seconds":%d,"status":"ok"}\n' $(( $(date +%s) - start )) >> /d/hst/metrics/phases.jsonl
      - name: Fetch and verify pinned source tarballs
        shell: bash
        run: |
          set -eu
          start=$(date +%s)
          python -I scripts/windows/fetch-sources.py --dest 'D:/hst/dl'
          printf '{"phase":"fetch","seconds":%d,"status":"ok"}\n' $(( $(date +%s) - start )) >> /d/hst/metrics/phases.jsonl
      - name: Stage branding
        shell: bash
        run: |
          set -eu
          python -m pip install "pillow==10.4.0"
          python -I scripts/stage-branding.py --out 'D:/hst/branding'
      - name: Extract source
        shell: bash
        run: |
          set -eu
          C:/cygwin64/bin/bash.exe -l -c 'cd "$(cygpath -u "$GITHUB_WORKSPACE")" && HST_REPO="$PWD" bash scripts/windows/trial-build.sh --extract'
      - name: Apply HST patches
        shell: bash
        run: |
          set -eu
          C:/cygwin64/bin/bash.exe -l -c 'cd "$(cygpath -u "$GITHUB_WORKSPACE")" && HST_REPO="$PWD" bash scripts/windows/trial-build.sh --patch'
      - name: Configure
        shell: bash
        run: |
          set -eu
          C:/cygwin64/bin/bash.exe -l -c 'cd "$(cygpath -u "$GITHUB_WORKSPACE")" && HST_REPO="$PWD" bash scripts/windows/trial-build.sh --configure'
      - name: Build within time budget
        shell: bash
        run: |
          set -eu
          export HST_BUILD_DEADLINE=$(( HST_JOB_START + 330 * 60 ))
          C:/cygwin64/bin/bash.exe -l -c 'cd "$(cygpath -u "$GITHUB_WORKSPACE")" && HST_REPO="$PWD" bash scripts/windows/trial-build.sh --build'
      - name: Summarize metrics
        if: ${{ always() }}
        shell: bash
        run: |
          set -eu
          python -I scripts/windows/summarize-trial.py --work 'D:/hst' --out 'D:/hst/artifacts' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload trial evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-trial-${{ github.run_id }}
          path: D:\hst\artifacts\
          if-no-files-found: error
          retention-days: 7
