# SPDX-License-Identifier: AGPL-3.0-only
name: Startup timing
# Times HST Office start-up on hosted Windows, macOS and Ubuntu runners from the installers of earlier build runs:
# launch to splash, splash gone, first Start Center window; first start of a new profile, later starts and a start
# with an emptied file cache, next to variants that split the time (Python tracer, HST extension moved out,
# precompiled Python, real-time scanning, stock LibreOffice) and the splash at 150 % on Windows.
# scripts/perf/startup-timing-*.sh. Evidence only: it fails only when an installer cannot be installed.
on:
  workflow_dispatch:
    inputs:
      windows_run_id:
        description: 'Desktop Windows run whose MSI is timed (empty: skip Windows)'
        type: string
        default: ''
      windows_baseline_run_id:
        description: 'Optional earlier Desktop Windows run whose MSI is timed on the same runner first, for a before/after'
        type: string
        default: ''
      macos_run_id:
        description: 'Desktop macOS run whose arm64 dmg is timed, the signed one when the run has it (empty: skip macOS)'
        type: string
        default: ''
      linux_run_id:
        description: 'Desktop Linux run whose .deb is timed (empty: skip Linux)'
        type: string
        default: ''
      variants:
        description: 'Comma list of variants (empty: all of the OS; see scripts/perf/startup-timing-*.sh)'
        type: string
        default: ''
      starts:
        description: 'Start sequence of each variant (empty: fresh,warm,warm,warm,cold; see scripts/perf/startup-timing.py)'
        type: string
        default: ''
      overlay_extension:
        description: 'Replace the bundled HST extension with one built from this commit before timing'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: startup-timing-${{ github.ref }}
  cancel-in-progress: false
jobs:
  timing:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-2022
          - os: macos
            runner: macos-15
          - os: linux
            runner: ubuntu-24.04
    env:
      PYTHONUTF8: '1'
      # Stock LibreOffice 26.8.2 next to HST (same runner, same harness). The Windows MSI is pinned as in windows-smoke.
      LO_MSI_URL: https://download.documentfoundation.org/libreoffice/stable/26.8.2/win/x86_64/LibreOffice_26.8.2_Win_x86-64.msi
      LO_MSI_ARCHIVE_URL: https://downloadarchive.documentfoundation.org/libreoffice/old/26.8.2.2/win/x86_64/LibreOffice_26.8.2.2_Win_x86-64.msi
      LO_MSI_SHA256: ff4b911403b67ee9e6249f820f9782c44bb32c94fdaa45b0da53a8e419e5307a
      LO_DMG_URL: https://downloadarchive.documentfoundation.org/libreoffice/old/26.8.2.2/mac/aarch64/LibreOffice_26.8.2.2_MacOS_aarch64.dmg
      LO_DEB_URL: https://downloadarchive.documentfoundation.org/libreoffice/old/26.8.2.2/deb/x86_64/LibreOffice_26.8.2.2_Linux_x86-64_deb.tar.gz
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Download the installer and time start-up
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OS: ${{ matrix.os }}
          WINDOWS_RUN: ${{ inputs.windows_run_id }}
          WINDOWS_BASELINE_RUN: ${{ inputs.windows_baseline_run_id }}
          MACOS_RUN: ${{ inputs.macos_run_id }}
          LINUX_RUN: ${{ inputs.linux_run_id }}
          VARIANTS: ${{ inputs.variants }}
          STARTS: ${{ inputs.starts }}
          OVERLAY: ${{ inputs.overlay_extension }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/startup"
          mkdir -p "$out"
          case "$OS" in windows) run="$WINDOWS_RUN" ;; macos) run="$MACOS_RUN" ;; *) run="$LINUX_RUN" ;; esac
          if [ -z "$run" ]; then echo "no run id for $OS: skipped" | tee "$out/skipped.txt"; exit 0; fi
          [[ "$run" =~ ^[0-9]+$ ]]
          [[ "$STARTS" =~ ^[a-z,]*$ ]]
          export STARTS
          python -m pip install -q pillow
          export HST_OVERLAY_OXT=""
          if [ "$OVERLAY" = true ]; then
            python -I scripts/build-extensions.py --output "$RUNNER_TEMP/oxt"
            export HST_OVERLAY_OXT="$RUNNER_TEMP/oxt/hst-vietnamese-tools.oxt"
          fi
          case "$OS" in
            windows)
              RUN_ID="$run" bash scripts/windows/download-smoke-msi.sh "$RUNNER_TEMP/msi" HST_MSI
              msi="$(grep '^HST_MSI=' "$GITHUB_ENV" | tail -n 1 | cut -d= -f2-)"
              if [ -n "${WINDOWS_BASELINE_RUN:-}" ]; then
                [[ "$WINDOWS_BASELINE_RUN" =~ ^[0-9]+$ ]]
                RUN_ID="$WINDOWS_BASELINE_RUN" bash scripts/windows/download-smoke-msi.sh "$RUNNER_TEMP/base-msi" BASE_MSI
                export BASE_MSI="$(cygpath -u "$(grep '^BASE_MSI=' "$GITHUB_ENV" | tail -n 1 | cut -d= -f2-)")"
              fi
              bash scripts/perf/startup-timing-windows.sh "$(cygpath -u "$msi")" "$out" "$VARIANTS" ;;
            macos)
              signed="hst-office-macos-arm64-dmg-signed-$run"
              count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" --paginate \
                --jq ".artifacts[] | select(.name == \"$signed\" and .expired == false) | .id" | wc -l | tr -d ' ')
              artifact="hst-office-macos-arm64-dmg-$run"
              if [ "$count" = 1 ]; then artifact="$signed"; fi
              echo "artifact: $artifact" | tee "$out/artifact.txt"
              gh run download "$run" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir "$RUNNER_TEMP/dmg"
              bash scripts/perf/startup-timing-macos.sh "$(find "$RUNNER_TEMP/dmg" -name '*.dmg' -print -quit)" "$out" "$VARIANTS" ;;
            *)
              gh run download "$run" --repo "$GITHUB_REPOSITORY" --name "hst-office-linux-deb-$run" --dir "$RUNNER_TEMP/deb"
              bash scripts/perf/startup-timing-linux.sh "$RUNNER_TEMP/deb" "$out" "$VARIANTS" ;;
          esac
          cat "$out/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload timing evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: startup-timing-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/startup/
          if-no-files-found: error
          retention-days: 7
