name: macOS verify 1.0.4 full screen dialogs (probe branch)
# Opens a dialog in native full screen while another document opens (stock code of the signed arm64 dmg of a
# Desktop macOS run). Evidence only; nothing is published.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Desktop macOS run id whose signed arm64 dmg is probed'
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: macos-verify-1-0-4-fsdialog
  cancel-in-progress: false
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download the signed arm64 dmg
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -eu
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "bad run id" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/dmg"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "hst-office-macos-arm64-dmg-signed-$RUN_ID" --dir "$RUNNER_TEMP/dmg"
          find "$RUNNER_TEMP/dmg" -name '*.dmg'
      - name: Probe dialogs in full screen when another document opens
        shell: bash
        run: |
          set -eu
          dmg=$(find "$RUNNER_TEMP/dmg" -name '*.dmg' -print -quit)
          bash scripts/macos/fsdialog-probe.sh "$dmg" "$RUNNER_TEMP/fsdialog/stock" || true
          for f in "$RUNNER_TEMP/fsdialog/stock"/*.json; do [ -f "$f" ] && { echo "$f"; cat "$f"; }; done >> "$GITHUB_STEP_SUMMARY" || true
          [ -f "$RUNNER_TEMP/fsdialog/stock/summary.md" ] && cat "$RUNNER_TEMP/fsdialog/stock/summary.md" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-verify-1-0-4-fsdialog-${{ github.run_id }}
          path: ${{ runner.temp }}/fsdialog/
          if-no-files-found: error
          retention-days: 14
