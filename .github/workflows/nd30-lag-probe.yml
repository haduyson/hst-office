# SPDX-License-Identifier: AGPL-3.0-only
name: ND30 field-switch probe (macOS)
# Times field switching in the ND30 wizard of the beta.5 arm64 dmg per extension variant. Evidence only; probe branch.
on:
  push:
    branches: [probe/nd30-field-lag-mac]
permissions:
  contents: read
  actions: read
concurrency:
  group: nd30-lag-probe
  cancel-in-progress: true
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download the dmg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/dmg"
          # beta.5 (5e49d28) arm64 dmg from its Desktop macOS run (the release is still a draft)
          gh run download 42264935810 --repo "$GITHUB_REPOSITORY" --name hst-office-macos-arm64-dmg-42264935810 --dir "$RUNNER_TEMP/dmg"
          find "$RUNNER_TEMP/dmg" -name '*.dmg'
      - name: Probe
        run: |
          dmg=$(find "$RUNNER_TEMP/dmg" -name '*.dmg' -print -quit)
          DRIVER=nd30-lag-probe3.py bash scripts/macos/nd30-lag-probe.sh "$dmg" "$RUNNER_TEMP/nd30lag" shipped-wide fix-wide
      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nd30-lag-probe-${{ github.run_id }}
          path: ${{ runner.temp }}/nd30lag/
          retention-days: 7
