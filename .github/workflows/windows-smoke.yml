# SPDX-License-Identifier: AGPL-3.0-only
name: Windows smoke
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release whose Windows MSI is installed and checked against its SHA256SUMS'
        type: string
        default: v1.0.0-beta.2
      run_id:
        description: 'Desktop Windows run whose MSI artifact is installed instead of the release MSI (empty: use release_tag)'
        type: string
        default: ''
      overlay_extension:
        description: 'Replace the bundled HST extension with one built from this commit (tests a fix without a full build)'
        type: boolean
        default: false
      update_policy_only:
        description: 'Only check the update-lock .reg templates of the user guide (skip the command smoke and Update now)'
        type: boolean
        default: false
      install_paths:
        description: 'Also install next to LibreOffice and over HST beta.4 (needs an MSI with HST Office''s own UpgradeCode, beta.5 on)'
        type: boolean
        default: true
      msi_edit:
        description: 'Install a copy of the MSI with these table edits (tries an installer rule without a build; see scripts/windows/smoke-edit-msi.ps1)'
        type: choice
        options: [none, legacy-reinstall]
        default: none
      scenarios:
        description: 'Run only these scenarios, as a JSON list such as ["commands","hst-first"] (empty: all of install_paths)'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: windows-smoke
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: windows-2022
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # commands: the MSI alone, every HST command and the update helper.
        # libreoffice-first / hst-first: the official LibreOffice MSI and HST Office in either order; both keep their own
        # ProgIDs, open commands and UNO install path and both start; uninstalling the second leaves the first intact.
        # uninstall-beta4-then-install: HST beta.4 installed, uninstalled (msiexec /x), then the new MSI.
        # upgrade-from-beta4: the new MSI installed over beta.4 (beta 1-4 users, silent installs, the updater): every file
        # present, no C++ runtime component installed and no component disallowed in the log, one entry left.
        # upgrade-from-beta5: the new MSI installed over beta.5 (HST Office's own code): one entry, every file, own ProgIDs.
        # ui-parity: the MSI with its default-apps box ticked; start-up questions of starts 1-3 of a new user, every
        # Tùy chọn ▸ HST Office page inside the Options dialog, the ND30 "Loại văn bản" list under real pointer moves and
        # the recent-documents thumbnail of a PDF with a faint stamp, text selected in HST PDF (light highlight, readable
        # text). ui-parity-unticked: the box left unticked (the question comes on start 2) and the option pages.
        # ui-parity-old-profile: HST beta.5 installed, started once, uninstalled, then this MSI (unticked) on the profile
        # beta.5 left: option pages and start-up questions.
        # Each scenario runs on a fresh runner.
        scenario: ${{ fromJSON(inputs.scenarios != '' && inputs.scenarios || (inputs.install_paths && '["commands","ui-parity","ui-parity-unticked","ui-parity-old-profile","libreoffice-first","hst-first","uninstall-beta4-then-install","upgrade-from-beta4","upgrade-from-beta5"]' || '["commands","ui-parity","ui-parity-unticked","ui-parity-old-profile"]')) }}
    env:
      # Current LibreOffice stable for Windows x64 (26.8.2.2), GPG-signed by the LibreOffice build key
      # C2839ECAD9408FBE9531C3E9F434A1EFAFEEAEA3; the archive keeps the same file after stable/ moves on.
      LO_MSI_URL: https://download.documentfoundation.org/libreoffice/stable/26.8.2/win/x86_64/LibreOffice_26.8.2_Win_x86-64.msi
      LO_MSI_ARCHIVE_URL: https://downloadarchive.documentfoundation.org/libreoffice/old/26.8.2.2/win/x86_64/LibreOffice_26.8.2.2_Win_x86-64.msi
      LO_MSI_SHA256: ff4b911403b67ee9e6249f820f9782c44bb32c94fdaa45b0da53a8e419e5307a
      # HST beta.5 for upgrade-from-beta5: the copy kept on HST's download site, pinned by its SHA256.
      BETA5_MSI_URL: https://office.hasontech.vn/tai/1.0.0-beta.5/HSTOffice_1.0.0-beta.5_Win_x86-64_en-US_vi.msi
      BETA5_MSI_SHA256: 645f605aafc6999e4c29ca5c3f64cf44ffddfd11a06e74b4e0540cf3c1fdf219
      # HST beta.4 (GitHub pre-release v1.0.0-beta.4, no longer on the download site), pinned by its SHA256.
      BETA4_MSI_SHA256: 4b3d7dcf0715c0afd3b594393f9c0ae3b12cca11f82a1089b7fa22e8fe72bc29
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Parse the PowerShell smoke scripts
        shell: bash
        run: pwsh -NoProfile -NonInteractive -File scripts/windows/check-ps-syntax.ps1
      - name: Download the MSI and verify its checksum
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          bash scripts/windows/download-smoke-msi.sh "$RUNNER_TEMP/msi" HST_MSI
      - name: Edit the MSI tables (installer rule trial)
        if: ${{ inputs.msi_edit != 'none' }}
        shell: bash
        env:
          MSI_EDIT: ${{ inputs.msi_edit }}
        run: |
          set -euo pipefail
          edited="$(cygpath -w "$RUNNER_TEMP/msi-edited")"
          mkdir -p "$(cygpath -u "$edited")"
          out="$edited\\$(basename "$(cygpath -u "$HST_MSI")")"
          pwsh -NoProfile -File scripts/windows/smoke-edit-msi.ps1 -Edit "$MSI_EDIT" -Msi "$HST_MSI" -OutMsi "$out"
          echo "HST_MSI=$out" >> "$GITHUB_ENV"
      - name: Old version first - install HST beta.5, start it once on the test profile, uninstall it
        if: ${{ matrix.scenario == 'ui-parity-old-profile' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/first" "$RUNNER_TEMP/out/old-version"
          cd "$RUNNER_TEMP/first"
          msi=HSTOffice_1.0.0-beta.5_Win_x86-64_en-US_vi.msi
          curl -fsSL --retry 3 -o "$msi" "$BETA5_MSI_URL"
          echo "$BETA5_MSI_SHA256  $msi" | sha256sum -c
          MSYS2_ARG_CONV_EXCL='*' msiexec.exe /i "$(cygpath -w "$PWD/$msi")" /qn /norestart /l*v "$(cygpath -w "$RUNNER_TEMP/out/old-version/install.log")"
          soffice="$(find '/c/Program Files' -maxdepth 4 -iname soffice.exe | head -n 1)"
          program="$(dirname "$soffice")"
          # the user's profile of the old version: welcome seen, extensions registered by beta.5
          timeout 600 "$program/python.exe" -X utf8 "$GITHUB_WORKSPACE/tests/runtime/check-windows-startup-prompts.py" --install "$(cygpath -w "$(dirname "$program")")" \
            --out "$(cygpath -w "$RUNNER_TEMP/out/old-version")" --profile "$(cygpath -w "$RUNNER_TEMP/old-profile")" --warm-only
          MSYS2_ARG_CONV_EXCL='*' msiexec.exe /x "$(cygpath -w "$PWD/$msi")" /qn /norestart /l*v "$(cygpath -w "$RUNNER_TEMP/out/old-version/uninstall.log")"
          # one copy for each check: both see the profile as beta.5 left it
          cp -r "$RUNNER_TEMP/old-profile" "$RUNNER_TEMP/old-profile-options"
          ls "$RUNNER_TEMP/old-profile/user" "$RUNNER_TEMP/old-profile/user/extensions" || echo "old profile not listed"
          bash "$GITHUB_WORKSPACE/scripts/windows/print-extension-sync-state.sh" "$RUNNER_TEMP/old-profile" "$(dirname "$program")" | tee "$RUNNER_TEMP/out/old-version/sync-state-beta5.txt"
      - name: Install the MSI silently
        if: ${{ matrix.scenario == 'commands' || startsWith(matrix.scenario, 'ui-parity') }}
        shell: bash
        env:
          # 1: the silent form of the ticked "Dùng HST Office để mở tài liệu văn phòng" box; 0: left unticked
          DEFAULT_APPS: ${{ (matrix.scenario == 'ui-parity-unticked' || matrix.scenario == 'ui-parity-old-profile') && '0' || '1' }}
          # ui-parity-unticked also leaves "Tạo lối tắt trên màn hình nền" unticked; the others keep its default (ticked)
          DESKTOP_LINKS: ${{ matrix.scenario == 'ui-parity-unticked' && '0' || '' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          log="$(cygpath -w "$RUNNER_TEMP/out/msi-install.log")"
          key='HKLM\SOFTWARE\HASON TECH\HST Office\DefaultApps'
          links=()
          [ -z "$DESKTOP_LINKS" ] || links=("CREATEDESKTOPLINK=$DESKTOP_LINKS")
          if [ "$DEFAULT_APPS" = 1 ]; then
            MSYS2_ARG_CONV_EXCL='*' msiexec.exe /i "$HST_MSI" /qn /norestart HSTDEFAULTAPPS=1 "${links[@]}" /l*v "$log"
            MSYS2_ARG_CONV_EXCL='*' reg.exe query "$key" /v ChosenAtInstall | grep -E 'ChosenAtInstall +REG_DWORD +0x1[[:space:]]*$' \
              || { echo "the ticked default-apps box did not write ChosenAtInstall=1" >&2; exit 1; }
          else
            MSYS2_ARG_CONV_EXCL='*' msiexec.exe /i "$HST_MSI" /qn /norestart "${links[@]}" /l*v "$log"
            if MSYS2_ARG_CONV_EXCL='*' reg.exe query "$key" /v ChosenAtInstall 2>/dev/null; then
              echo "the unticked default-apps box wrote ChosenAtInstall" >&2; exit 1
            fi
          fi
          soffice="$(find '/c/Program Files' -maxdepth 4 -iname soffice.exe | head -n 1)"
          [ -n "$soffice" ] || { echo "soffice.exe not found after install" >&2; exit 1; }
          install_dir="$(dirname "$(dirname "$soffice")")"
          echo "HST_INSTALL=$(cygpath -w "$install_dir")" >> "$GITHUB_ENV"
          echo "installed at $install_dir"
          find "$install_dir/program" -maxdepth 1 \( -iname 'python*' -o -iname 'pyuno*' \) | head -n 20
      - name: Keep a crash dump of soffice.bin
        if: ${{ matrix.scenario == 'commands' || startsWith(matrix.scenario, 'ui-parity') }}
        shell: bash
        run: |
          set -euo pipefail
          # Windows Error Reporting writes a minidump when the office crashes; Collect diagnostics prints its stack.
          dumps="$(cygpath -w "$RUNNER_TEMP/out/crash")"
          mkdir -p "$(cygpath -u "$dumps")"
          key='HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\soffice.bin'
          MSYS2_ARG_CONV_EXCL='*' reg.exe add "$key" /v DumpFolder /t REG_EXPAND_SZ /d "$dumps" /f
          MSYS2_ARG_CONV_EXCL='*' reg.exe add "$key" /v DumpType /t REG_DWORD /d 1 /f
          MSYS2_ARG_CONV_EXCL='*' reg.exe add "$key" /v DumpCount /t REG_DWORD /d 5 /f
      - name: Taskbar ids - Start menu shortcuts and ProgIDs carry HST Office's own AppUserModelIDs
        if: ${{ matrix.scenario == 'commands' }}
        shell: bash
        run: |
          set -euo pipefail
          pwsh -NoProfile -File scripts/windows/check-app-user-model-ids.ps1 -Install "$HST_INSTALL"
      - name: App shortcuts - HST Writer, HST Sheets and HST Slides on the desktop and in the Start menu
        if: ${{ matrix.scenario == 'commands' || matrix.scenario == 'ui-parity-unticked' }}
        shell: bash
        env:
          EXPECT: ${{ matrix.scenario == 'ui-parity-unticked' && 'no-desktop' || 'installed' }}
        run: |
          set -euo pipefail
          pwsh -NoProfile -File scripts/windows/check-app-shortcuts.ps1 -Expect "$EXPECT" -Install "$HST_INSTALL"
      - name: Overlay the extension built from this commit
        if: ${{ (matrix.scenario == 'commands' || startsWith(matrix.scenario, 'ui-parity')) && inputs.overlay_extension }}
        shell: bash
        run: |
          set -euo pipefail
          python -I scripts/build-extensions.py --output "$RUNNER_TEMP/oxt"
          target="$(cygpath -u "$HST_INSTALL")/share/extensions/hst-vietnamese-tools"
          rm -rf "$target"
          mkdir -p "$target"
          python -I -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$RUNNER_TEMP/oxt/hst-vietnamese-tools.oxt" "$target"
          echo "overlaid $target"
      - name: Update-lock templates - import each .reg of the user guide and check the lock
        if: ${{ matrix.scenario == 'commands' }}
        shell: bash
        run: |
          set -euo pipefail
          install="$(cygpath -u "$HST_INSTALL")"
          export PATH="$install/program:$PATH"
          export UNO_PATH="$HST_INSTALL\\program"
          files=extensions/hst-vietnamese-tools/help/files
          out="$(cygpath -w "$RUNNER_TEMP/out/update-policy")"
          key='HKLM\SOFTWARE\Policies\HASON TECH\HST Office\org.openoffice.Office.HSTUpdate'
          # LibreOffice's policy key, which HST Office read up to beta.4: only its HSTUpdate subtree (the beta.4 templates)
          # may still apply, and only while HST Office's own key has no HSTUpdate subtree.
          old='HKLM\SOFTWARE\Policies\LibreOffice'
          foreign=/org.openoffice.Office.Common/Misc/ShowTipOfTheDay
          reg() { MSYS2_ARG_CONV_EXCL='*' reg.exe "$@"; }
          lock() { reg add "$1" /v Value /t REG_SZ /d "$2" /f && reg add "$1" /v Final /t REG_DWORD /d 1 /f; }
          # MSYS2_ARG_CONV_EXCL: Git Bash would turn the "/org.openoffice..." value of --ignored into a Windows path.
          probe() { MSYS2_ARG_CONV_EXCL='*' timeout 600 "$install/program/python.exe" tests/runtime/check-update-policy.py --soffice "$HST_INSTALL\\program\\soffice.exe" --profile "$1" --source core --out "$out" --ignored "$foreign" "${@:2}"; }
          probe none
          # a LibreOffice policy must not reach HST Office; a beta.4 update lock under the old key still does
          lock "$old\org.openoffice.Office.Common\Misc\ShowTipOfTheDay" false
          lock "$old\org.openoffice.Office.HSTUpdate\AllowInstall" false
          probe chi-tai-ve --label old-key-update-lock
          # one template after the other: each .reg replaces the previous lock and hides the old key's ("nothing else
          # locked": kenh-chinh-thuc fails if the old AllowInstall lock leaked through)
          for name in tat-kiem-tra chi-tai-ve kenh-chinh-thuc; do
            reg import "$(cygpath -w "$files/hst-office-$name.reg")"
            reg query "$key" /s
            probe "$name"
          done
          reg import "$(cygpath -w "$files/hst-office-go-khoa.reg")"
          for prop in AutoCheck ManualCheck AllowInstall Channel; do
            if reg query "$key\\$prop" >/dev/null 2>&1; then echo "hst-office-go-khoa.reg left the $prop lock in place" >&2; exit 1; fi
          done
          reg query "$key" >/dev/null || { echo "hst-office-go-khoa.reg did not leave the empty key that hides the old lock" >&2; exit 1; }
          probe none
          reg delete "$old" /f
          reg delete "$key" /f
      - name: Smoke-test every HST command in the installed office
        if: ${{ matrix.scenario == 'commands' && !inputs.update_policy_only }}
        shell: bash
        run: |
          set -euo pipefail
          install="$(cygpath -u "$HST_INSTALL")"
          export PATH="$install/program:$PATH"
          export UNO_PATH="$HST_INSTALL\\program"
          timeout 900 "$install/program/python.exe" tests/runtime/check-windows-smoke.py --install "$HST_INSTALL" --out "$RUNNER_TEMP/out/smoke" --screenshots "$RUNNER_TEMP/out/screens"
      - name: COM automation - HST Office's own ProgIDs, none of LibreOffice's
        if: ${{ matrix.scenario == 'commands' && !inputs.update_policy_only }}
        shell: bash
        run: |
          set -euo pipefail
          install="$(cygpath -u "$HST_INSTALL")"
          # COM starts the office on the user's default profile (bootstrap.ini UserInstallation). Its first visible
          # start shows the modal welcome dialog, which holds Documents.Open until someone closes it: take that profile
          # past its first start, as a user's is (the start-up questions themselves are checked by ui-parity).
          raw="$(sed -n 's/^UserInstallation=//p' "$install/program/bootstrap.ini" | tr -d '\r')"
          raw="${raw//\$SYSUSERCONFIG/$(cygpath -m "$APPDATA")}"
          profile="$(cygpath -w "$(python -I -c 'import sys, urllib.parse; print(urllib.parse.unquote(sys.argv[1]).removeprefix("file:///"))' "$raw")")"
          echo "default profile: $profile"
          timeout 600 "$install/program/python.exe" -X utf8 tests/runtime/check-windows-startup-prompts.py --install "$HST_INSTALL" \
            --out "$(cygpath -w "$RUNNER_TEMP/out/com-warm")" --profile "$profile" --warm-only
          timeout 900 pwsh -NoProfile -File scripts/windows/smoke-com-automation.ps1 -Out "$(cygpath -w "$RUNNER_TEMP/out/com")"
      - name: Update now - download, verify and dry-run the msiexec helper
        if: ${{ matrix.scenario == 'commands' && !inputs.update_policy_only }}
        shell: bash
        run: |
          set -euo pipefail
          python -I tests/runtime/check-update-install-smoke.py
      - name: Collect diagnostics
        if: ${{ always() && matrix.scenario == 'commands' }}
        shell: bash
        run: |
          set -eu
          # the office may still hold a modal dialog after a timeout; stop it so its logs can be read
          MSYS2_ARG_CONV_EXCL='*' taskkill.exe /F /IM soffice.bin /IM soffice.exe /IM oosplash.exe 2>&1 || echo "no office process was left running"
          mkdir -p "$RUNNER_TEMP/out/smoke"
          cp -r "$(cygpath -u "$HST_INSTALL")/share/extensions/hst-vietnamese-tools" "$RUNNER_TEMP/out/extension-as-installed" || echo "extension directory missing"
          # a crashed office: the Application log entry (faulting module and offset) and the dump's stack
          pwsh -NoProfile -File scripts/windows/print-office-crashes.ps1 -Install "$HST_INSTALL" -Dumps "$(cygpath -w "$RUNNER_TEMP/out/crash")" \
            | tee "$RUNNER_TEMP/out/crash/office-crashes.txt" || echo "crash report failed"
          # sed reads the whole listing: head would close the pipe early and pipefail turns that SIGPIPE into a failure
          find "$RUNNER_TEMP/out" -type f | sed -n '1,100p'
          for results in "$RUNNER_TEMP"/out/smoke/smoke-results.json "$RUNNER_TEMP"/out/update-policy/*.json; do
            [ -f "$results" ] || continue
            python -I -X utf8 -c "import json,sys; r=json.load(open(sys.argv[1], encoding='utf-8')); print('\n'.join('%s %s %s' % (x['status'], r.get('profile', 'smoke'), x['check']) for x in r['results']))" "$results" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Upload smoke evidence
        if: ${{ always() && matrix.scenario == 'commands' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}\out\
          if-no-files-found: error
          retention-days: 7
      - name: App shortcuts - uninstall removes them
        # Last step of the commands scenario: nothing after it needs the installed office.
        if: ${{ !cancelled() && matrix.scenario == 'commands' && env.HST_INSTALL != '' }}
        shell: bash
        run: |
          set -euo pipefail
          MSYS2_ARG_CONV_EXCL='*' taskkill.exe /F /IM soffice.bin /IM soffice.exe /IM oosplash.exe 2>&1 || echo "no office process was left running"
          log="$(cygpath -w "$RUNNER_TEMP/msi-uninstall.log")"
          rc=0
          MSYS2_ARG_CONV_EXCL='*' msiexec.exe /x "$HST_MSI" /qn /norestart /l*v "$log" || rc=$?
          [ "$rc" -eq 0 ] || [ "$rc" -eq 3010 ] || { echo "uninstall failed with $rc" >&2; iconv -f UTF-16LE -t UTF-8 "$(cygpath -u "$log")" | tail -n 40 >&2 || echo "uninstall log unreadable" >&2; exit 1; }
          pwsh -NoProfile -File scripts/windows/check-app-shortcuts.ps1 -Expect removed
      - name: UI parity - start-up questions of starts 1, 2 and 3
        if: ${{ !cancelled() && startsWith(matrix.scenario, 'ui-parity') && env.HST_INSTALL != '' }}
        shell: bash
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          set -euo pipefail
          install="$(cygpath -u "$HST_INSTALL")"
          out="$(cygpath -w "$RUNNER_TEMP/out/startup-prompts")"
          case "$SCENARIO" in
            ui-parity) extra=(--expect registered) ;;
            ui-parity-unticked) extra=(--expect question --answer accept) ;;
            *) extra=(--expect question --answer later --carried --profile "$(cygpath -w "$RUNNER_TEMP/old-profile")") ;;
          esac
          timeout 900 "$install/program/python.exe" -X utf8 tests/runtime/check-windows-startup-prompts.py --install "$HST_INSTALL" --out "$out" "${extra[@]}"
      - name: UI parity - every Tùy chọn ▸ HST Office page in the Options dialog
        if: ${{ !cancelled() && startsWith(matrix.scenario, 'ui-parity') && env.HST_INSTALL != '' }}
        shell: bash
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          set -euo pipefail
          install="$(cygpath -u "$HST_INSTALL")"
          extra=()
          [ "$SCENARIO" != ui-parity-old-profile ] || extra=(--carried --profile "$(cygpath -w "$RUNNER_TEMP/old-profile-options")")
          rc=0
          timeout 900 "$install/program/python.exe" -X utf8 tests/runtime/check-windows-options-pages.py --install "$HST_INSTALL" --out "$(cygpath -w "$RUNNER_TEMP/out/options-pages")" "${extra[@]}" || rc=1
          if [ "$SCENARIO" = ui-parity-old-profile ]; then
            # the same profile at its next start: what the user keeps seeing after the first start of the new version
            timeout 900 "$install/program/python.exe" -X utf8 tests/runtime/check-windows-options-pages.py --install "$HST_INSTALL" --out "$(cygpath -w "$RUNNER_TEMP/out/options-pages-start2")" "${extra[@]}" || rc=1
          fi
          exit "$rc"
      - name: UI parity - ND30 "Loại văn bản" list under real pointer moves
        if: ${{ !cancelled() && matrix.scenario == 'ui-parity' && env.HST_INSTALL != '' }}
        shell: bash
        run: |
          set -euo pipefail
          install="$(cygpath -u "$HST_INSTALL")"
          timeout 600 "$install/program/python.exe" -X utf8 tests/runtime/check-windows-nd30-type-hover.py --install "$HST_INSTALL" --out "$(cygpath -w "$RUNNER_TEMP/out/nd30-type-hover")"
      - name: UI parity - recent-documents thumbnail of a PDF with a faint stamp
        if: ${{ !cancelled() && matrix.scenario == 'ui-parity' && env.HST_INSTALL != '' }}
        shell: bash
        run: |
          set -euo pipefail
          install="$(cygpath -u "$HST_INSTALL")"
          timeout 600 "$install/program/python.exe" -X utf8 tests/runtime/check-windows-pdf-recent-thumbnail.py --install "$HST_INSTALL" --out "$(cygpath -w "$RUNNER_TEMP/out/pdf-recent-thumbnail")"
      - name: UI parity - text selected in HST PDF stays readable under a light highlight
        if: ${{ !cancelled() && matrix.scenario == 'ui-parity' && env.HST_INSTALL != '' }}
        shell: bash
        run: |
          set -euo pipefail
          install="$(cygpath -u "$HST_INSTALL")"
          timeout 600 "$install/program/python.exe" -X utf8 tests/runtime/check-windows-pdf-selection.py --install "$HST_INSTALL" --out "$(cygpath -w "$RUNNER_TEMP/out/pdf-selection")"
      - name: UI parity - translucent rectangles stay translucent (Impress slide show, Calc Text Import header)
        if: ${{ !cancelled() && matrix.scenario == 'ui-parity' && env.HST_INSTALL != '' }}
        shell: bash
        run: |
          set -euo pipefail
          install="$(cygpath -u "$HST_INSTALL")"
          timeout 600 "$install/program/python.exe" -X utf8 tests/runtime/check-windows-transparent-rects.py --install "$HST_INSTALL" --out "$(cygpath -w "$RUNNER_TEMP/out/transparent-rects")"
      - name: UI parity - diagnostics
        if: ${{ always() && startsWith(matrix.scenario, 'ui-parity') }}
        shell: bash
        run: |
          set -eu
          MSYS2_ARG_CONV_EXCL='*' taskkill.exe /F /IM soffice.bin /IM soffice.exe /IM oosplash.exe 2>&1 || echo "no office process was left running"
          mkdir -p "$RUNNER_TEMP/out/crash"
          if [ -n "${HST_INSTALL:-}" ]; then
            pwsh -NoProfile -File scripts/windows/print-office-crashes.ps1 -Install "$HST_INSTALL" -Dumps "$(cygpath -w "$RUNNER_TEMP/out/crash")" \
              | tee "$RUNNER_TEMP/out/crash/office-crashes.txt" || echo "crash report failed"
          fi
          if [ "${{ matrix.scenario }}" = ui-parity-old-profile ] && [ -n "${HST_INSTALL:-}" ]; then
            # whether this version re-registered its bundled extension in the profile beta.5 left (user/extensions/buildid,
            # lastsynchronized against the install's share/extensions)
            for profile in old-profile old-profile-options; do
              bash scripts/windows/print-extension-sync-state.sh "$RUNNER_TEMP/$profile" "$(cygpath -u "$HST_INSTALL")" | tee "$RUNNER_TEMP/out/sync-state-$profile.txt"
            done
          fi
          for results in "$RUNNER_TEMP"/out/*/results.json; do
            [ -f "$results" ] || continue
            python -I -X utf8 -c "import json,sys; r=json.load(open(sys.argv[1], encoding='utf-8')); print('\n'.join('%s %s %s' % (x['status'], r['profile'], x['check']) for x in r['results'] if x['status'] != 'INFO'))" "$results" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Upload UI parity evidence
        if: ${{ always() && startsWith(matrix.scenario, 'ui-parity') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-${{ matrix.scenario }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}\out\
            !${{ runner.temp }}\out\**\profile\**
          if-no-files-found: error
          retention-days: 7
      - name: Check the MSI upgrade rules
        if: ${{ matrix.scenario != 'commands' && !startsWith(matrix.scenario, 'ui-parity') }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          # Upgrade and Property tables: HST Office's own UpgradeCode, bounded removal of the LibreOffice-coded betas.
          python -I -W ignore::DeprecationWarning scripts/check-msi-upgrade.py --msi "$HST_MSI" | tee "$RUNNER_TEMP/out/msi-upgrade-rules.txt"
          # Registry table: no App Paths, LibreOffice URI scheme, ProgID, Explorer class id or Software\LibreOffice key.
          python -I -W ignore::DeprecationWarning scripts/check-msi-coexist.py --msi "$HST_MSI" | tee "$RUNNER_TEMP/out/msi-coexist-rules.txt"
          # File and MsiAssembly tables: no legacy CLI-UNO bridge, nothing installed into the .NET GAC.
          python -I -W ignore::DeprecationWarning scripts/check-msi-no-cli.py --msi "$HST_MSI" | tee "$RUNNER_TEMP/out/msi-no-cli.txt"
      - name: Download the other installer (LibreOffice, HST beta.4 or beta.5)
        if: ${{ matrix.scenario != 'commands' && !startsWith(matrix.scenario, 'ui-parity') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SCENARIO: ${{ matrix.scenario }}
        run: |
          set -euo pipefail
          if [ "$SCENARIO" = libreoffice-first ] || [ "$SCENARIO" = hst-first ]; then
            mkdir -p "$RUNNER_TEMP/first"
            cd "$RUNNER_TEMP/first"
            msi=LibreOffice_26.8.2_Win_x86-64.msi
            curl -fsSL --retry 3 -o "$msi" "$LO_MSI_URL" || curl -fsSL --retry 3 -o "$msi" "$LO_MSI_ARCHIVE_URL"
            echo "$LO_MSI_SHA256  $msi" | sha256sum -c
            echo "OTHER_MSI=$(cygpath -w "$PWD/$msi")" >> "$GITHUB_ENV"
          elif [ "$SCENARIO" = upgrade-from-beta5 ]; then
            mkdir -p "$RUNNER_TEMP/first"
            cd "$RUNNER_TEMP/first"
            msi=HSTOffice_1.0.0-beta.5_Win_x86-64_en-US_vi.msi
            curl -fsSL --retry 3 -o "$msi" "$BETA5_MSI_URL"
            echo "$BETA5_MSI_SHA256  $msi" | sha256sum -c
            echo "OTHER_MSI=$(cygpath -w "$PWD/$msi")" >> "$GITHUB_ENV"
          else
            RUN_ID='' RELEASE_TAG=v1.0.0-beta.4 bash scripts/windows/download-smoke-msi.sh "$RUNNER_TEMP/first" OTHER_MSI
            # independent of the release's own SHA256SUMS: the pinned hash of the beta.4 MSI
            echo "$BETA4_MSI_SHA256  $(cygpath -u "$(grep '^OTHER_MSI=' "$GITHUB_ENV" | tail -n 1 | cut -d= -f2-)")" | sha256sum -c
          fi
      - name: Install both and check them
        if: ${{ matrix.scenario != 'commands' && !startsWith(matrix.scenario, 'ui-parity') }}
        shell: bash
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          set -euo pipefail
          pwsh -NoProfile -File scripts/windows/smoke-install-paths.ps1 -Scenario "$SCENARIO" -HstMsi "$HST_MSI" -OtherMsi "$OTHER_MSI" -Out "$(cygpath -w "$RUNNER_TEMP/out/$SCENARIO")"
      - name: Upload install-path evidence
        if: ${{ always() && matrix.scenario != 'commands' && !startsWith(matrix.scenario, 'ui-parity') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-install-paths-${{ matrix.scenario }}-${{ github.run_id }}
          path: ${{ runner.temp }}\out\
          if-no-files-found: error
          retention-days: 7
