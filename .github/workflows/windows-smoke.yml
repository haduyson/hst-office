# SPDX-License-Identifier: AGPL-3.0-only
name: Windows smoke
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release whose Windows MSI is installed and checked against its SHA256SUMS'
        type: string
        default: v1.0.0-beta.2
      overlay_extension:
        description: 'Replace the bundled HST extension with one built from this commit (tests a fix without a full build)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: windows-smoke
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      MSI_NAME: HSTOffice_1.0.0_Win_x86-64_en-US_vi.msi
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Download the release MSI and verify its checksum
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/msi"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/msi" --pattern "$MSI_NAME" --pattern SHA256SUMS
          cd "$RUNNER_TEMP/msi"
          grep -F "$MSI_NAME" SHA256SUMS > msi.sha256
          sha256sum -c msi.sha256
      - name: Install the MSI silently
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          msi="$(cygpath -w "$RUNNER_TEMP/msi/$MSI_NAME")"
          log="$(cygpath -w "$RUNNER_TEMP/out/msi-install.log")"
          MSYS2_ARG_CONV_EXCL='*' msiexec.exe /i "$msi" /qn /norestart /l*v "$log"
          soffice="$(find '/c/Program Files' -maxdepth 4 -iname soffice.exe | head -n 1)"
          [ -n "$soffice" ] || { echo "soffice.exe not found after install" >&2; exit 1; }
          install_dir="$(dirname "$(dirname "$soffice")")"
          echo "HST_INSTALL=$(cygpath -w "$install_dir")" >> "$GITHUB_ENV"
          echo "installed at $install_dir"
          ls "$install_dir/program" | grep -i -E 'python|pyuno'
      - name: Overlay the extension built from this commit
        if: ${{ inputs.overlay_extension }}
        shell: bash
        run: |
          set -euo pipefail
          python -I scripts/build-extensions.py --output "$RUNNER_TEMP/oxt"
          target="$(cygpath -u "$HST_INSTALL")/share/extensions/hst-vietnamese-tools"
          rm -rf "$target"
          mkdir -p "$target"
          python -I -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$RUNNER_TEMP/oxt/hst-vietnamese-tools.oxt" "$target"
          echo "overlaid $target"
      - name: Smoke-test every HST command in the installed office
        shell: bash
        run: |
          set -euo pipefail
          install="$(cygpath -u "$HST_INSTALL")"
          export PATH="$install/program:$PATH"
          export UNO_PATH="$HST_INSTALL\\program"
          "$install/program/python.exe" tests/runtime/check-windows-smoke.py --install "$HST_INSTALL" --out "$RUNNER_TEMP/out/smoke" --screenshots "$RUNNER_TEMP/out/screens"
      - name: Collect diagnostics
        if: ${{ always() }}
        shell: bash
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/out/smoke"
          cp -r "$(cygpath -u "$HST_INSTALL")/share/extensions/hst-vietnamese-tools" "$RUNNER_TEMP/out/extension-as-installed" || echo "extension directory missing"
          find "$RUNNER_TEMP/out" -type f | head -n 100
          python -I -c "import json,sys; r=json.load(open(sys.argv[1], encoding='utf-8')); print('\n'.join('%s %s' % (x['status'], x['check']) for x in r['results']))" "$RUNNER_TEMP/out/smoke/smoke-results.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload smoke evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}\out\
          if-no-files-found: error
          retention-days: 7
