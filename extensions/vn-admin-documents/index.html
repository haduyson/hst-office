<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>HST Administrative Documents</title>
  <link rel="stylesheet" href="shared/plugin-ui.css">
  <link rel="stylesheet" href="styles.css">
  <script src="vendor/plugins.js"></script>
  <script src="plugin.bundle.js"></script>
</head>
<body>
  <h1 data-i18n="Administrative document (Decree 30/2020)">Administrative document (Decree 30/2020)</h1>
  <form id="nd30-form" autocomplete="off">
    <label for="doc-type" data-i18n="Document type">Document type</label>
    <select id="doc-type" name="type"></select>

    <label for="parentAgency" data-i18n="Parent agency (optional)">Parent agency (optional)</label>
    <input id="parentAgency" name="parentAgency">
    <label for="agency" data-i18n="Issuing agency">Issuing agency</label>
    <input id="agency" name="agency">

    <div class="hst-row">
      <div><label for="number" data-i18n="Number">Number</label><input id="number" name="number" inputmode="numeric"></div>
      <div><label for="symbol" data-i18n="Symbol">Symbol</label><input id="symbol" name="symbol" data-i18n-placeholder="e.g. UBND-VP"></div>
    </div>
    <div class="hst-row">
      <div><label for="place" data-i18n="Place">Place</label><input id="place" name="place"></div>
      <div><label for="date" data-i18n="Issue date">Issue date</label><input id="date" name="date" type="date"></div>
    </div>

    <label for="summary" data-i18n="Summary (subject)">Summary (subject)</label>
    <input id="summary" name="summary">
    <div id="kinhGui-group">
      <label for="kinhGui" data-i18n="Addressed to (one per line)">Addressed to (one per line)</label>
      <textarea id="kinhGui" name="kinhGui" rows="2"></textarea>
    </div>
    <label for="body" data-i18n="Content (one paragraph per line)">Content (one paragraph per line)</label>
    <textarea id="body" name="body" rows="5"></textarea>

    <label for="signerAuthority" data-i18n="Signing authority (e.g. KT. GIÁM ĐỐC)">Signing authority (e.g. KT. GIÁM ĐỐC)</label>
    <input id="signerAuthority" name="signerAuthority">
    <label for="signerTitle" data-i18n="Signer position (optional)">Signer position (optional)</label>
    <input id="signerTitle" name="signerTitle">
    <label for="signerName" data-i18n="Signer full name">Signer full name</label>
    <input id="signerName" name="signerName">
    <label for="recipients" data-i18n="Recipients (one per line)">Recipients (one per line)</label>
    <textarea id="recipients" name="recipients" rows="3"></textarea>
    <p class="hst-hint" data-i18n="Empty fields are inserted as [placeholders]. HST never fills in agency or signer names.">Empty fields are inserted as [placeholders]. HST never fills in agency or signer names.</p>

    <h2 data-i18n="Page setup">Page setup</h2>
    <label class="hst-check"><input type="checkbox" id="apply-page-setup" checked>
      <span data-i18n="Apply A4 and Decree 30 margins to the whole document">Apply A4 and Decree 30 margins to the whole document</span></label>
    <div class="hst-row" id="margins">
      <div><label for="m-top" data-i18n="Top (mm)">Top (mm)</label><input id="m-top" type="number" step="1"></div>
      <div><label for="m-bottom" data-i18n="Bottom (mm)">Bottom (mm)</label><input id="m-bottom" type="number" step="1"></div>
      <div><label for="m-left" data-i18n="Left (mm)">Left (mm)</label><input id="m-left" type="number" step="1"></div>
      <div><label for="m-right" data-i18n="Right (mm)">Right (mm)</label><input id="m-right" type="number" step="1"></div>
    </div>
    <p class="hst-hint" data-i18n="Allowed: top/bottom 20–25, left 30–35, right 15–20 mm.">Allowed: top/bottom 20–25, left 30–35, right 15–20 mm.</p>

    <div class="hst-actions">
      <button type="button" id="btn-preview" data-i18n="Preview">Preview</button>
      <button type="button" id="btn-insert" class="hst-primary" disabled data-i18n="Insert at cursor">Insert at cursor</button>
      <button type="button" id="btn-close" data-i18n="Close">Close</button>
    </div>
  </form>
  <h2 data-i18n="Preview">Preview</h2>
  <div id="preview" class="hst-preview" aria-live="polite"></div>
  <div id="hst-status" class="hst-status"></div>
  <p class="hst-hint" data-i18n="Formatting aid only; HST does not certify legal validity.">Formatting aid only; HST does not certify legal validity.</p>
  <div class="hst-footer"><a href="about.html" data-i18n="About &amp; licenses">About &amp; licenses</a></div>
</body>
</html>
