<!doctype html>

<html lang="vi">
<meta charset="utf-8">
<style>
@font-face { font-family: BeVietnam; src: url('$font_regular'); font-weight: 400; }
@font-face { font-family: BeVietnam; src: url('$font_semibold'); font-weight: 600; }
@font-face { font-family: BeVietnam; src: url('$font_bold'); font-weight: 700; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 360px; height: 104px; background: transparent; }
.card {
  position: relative; width: 360px; height: 104px; overflow: hidden;
  border: 1px solid $border; border-radius: 8px;
  background: linear-gradient(110deg, #fff 25%, $tint 100%);
  color: #25364a; font-family: BeVietnam, sans-serif;
}
.card::before {
  content: ''; position: absolute; left: 0; top: 12px; bottom: 12px;
  width: 3px; border-radius: 0 3px 3px 0; background: $accent;
}
header { position: absolute; left: 14px; top: 7px; height: 30px; display: flex; align-items: center; gap: 10px; }
.logo { width: ${logo_width}px; height: 30px; object-fit: contain; }
h1 { margin: 0; font-size: 18px; line-height: 26px; letter-spacing: -.4px; font-weight: 700; color: $ink; }
p { position: absolute; left: 14px; right: 14px; top: 40px; margin: 0; font-size: 12.5px; line-height: 17px; font-weight: 400; }
footer { position: absolute; bottom: 7px; left: 14px; right: 14px; display: flex; align-items: center; justify-content: space-between; height: 18px; }
.cta { color: $ink; font-size: 12px; font-weight: 600; }
.owner { color: #526071; font-size: 12px; font-weight: 600; letter-spacing: .7px; }
.company p { color: $text; }
.company .ecosystem { color: $muted; font-size: 12px; }
.company .owner { letter-spacing: 0; font-weight: 400; }
</style>
<article class="card $card_class" aria-label="$name — $tagline">
  <header>$logo_html<h1>$name</h1></header>
  <p>$tagline$detail_html</p>
  <footer><span class="cta">$cta</span><span class="owner">$owner</span></footer>
</article>
</html>
