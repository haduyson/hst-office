<!doctype html>

<html lang="vi">
<meta charset="utf-8">
<style>
@font-face { font-family: BeVietnam; src: url('$font_regular'); font-weight: 400; }
@font-face { font-family: BeVietnam; src: url('$font_semibold'); font-weight: 600; }
@font-face { font-family: BeVietnam; src: url('$font_bold'); font-weight: 700; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 160px; height: 104px; background: transparent; }
/* Compact slot of windows narrower than 1280 px: logo and short name only, same even card as the wide art. */
.card {
  position: relative; width: 160px; height: 104px; overflow: hidden;
  border: 1px solid $border; border-radius: 8px;
  background: linear-gradient(110deg, #fff 25%, $tint 100%);
  color: #25364a; font-family: BeVietnam, sans-serif;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  padding: 0 8px;
}
.logo { height: 30px; width: ${logo_width}px; max-width: 136px; object-fit: contain; }
h1 { margin: 0; max-width: 142px; font-size: 16px; line-height: 22px; letter-spacing: -.3px; font-weight: 700;
     color: $ink; white-space: nowrap; }
.owner { color: #526071; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: .5px; white-space: nowrap; }
.company .owner { letter-spacing: 0; font-weight: 400; }
</style>
<article class="card $card_class" aria-label="$name — $tagline">
  $logo_html
  <h1>$name</h1>
  <span class="owner">$owner</span>
</article>
</html>
