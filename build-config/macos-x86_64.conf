# SPDX-License-Identifier: AGPL-3.0-only
# HST Office - LibreOffice 26.8.1.1 configure options for macOS x86_64 (.dmg), native build on a
# GitHub-hosted runner (no --host: build == host). One argument per line; scripts/macos/trial-build.sh
# checks every name against the pinned configure.ac and writes autogen.input. @BRANDING@ is the staged
# branding dir. The HST release version comes from /VERSION (openoffice.lst), not --with-package-version.
# Parallelism defaults to the runner's CPU count. Unsigned: signing happens in a separate gated job.
--enable-release-build
--with-product-name=HST Office
--with-vendor=HASON TECH
--with-branding=@BRANDING@
--with-macosx-bundle-identifier=vn.hasontech.hstoffice
--with-macosx-version-min-required=11.0
--with-lang=vi
--with-myspell-dicts
--without-help
--without-helppack-integration
--without-java
--without-junit
--disable-odk
--disable-online-update
--disable-breakpad
--disable-lto
--disable-cve-tests
--without-doxygen
--enable-mergelibs
--with-package-format=dmg
