# SPDX-License-Identifier: AGPL-3.0-only
# One argument per line; checked against LibreOffice 26.8.1.1 configure.ac.
# Native configure/build/installer validation: UNVERIFIED (OPS-01, SIGN-01, QA-01).
# Requires native x86_64, Xcode >=14.3 (not 15.0 with macOS 11), SDK >=13.3.
# Run from the pinned upstream/libreoffice directory after HST patch integration.
--host=x86_64-apple-darwin
--enable-release-build
--with-product-name=HST Office
--with-vendor=HASON TECH
--with-branding=../../branding/libreoffice
--with-package-version=26.8.1.1
--with-macosx-bundle-identifier=vn.hasontech.hstoffice
--with-macosx-version-min-required=11.0
--with-lang=vi
--with-myspell-dicts
--without-java
--disable-odk
--disable-online-update
--disable-breakpad
--with-package-format=dmg
--with-parallelism=4
