# HST Office — LibreOffice 26.8.1.1 configure options for Linux x86_64 (.deb).
# One option per line (copied verbatim into autogen.input by scripts/build-linux.sh).
# Each option was checked against the pinned configure.ac (AC_ARG_WITH/ENABLE).
--enable-release-build
--with-product-name=HST Office
--with-vendor=HASON TECH
--with-branding=/home/office/build/branding-staging
--with-lang=vi
--with-myspell-dicts
--without-system-dicts
--without-help
--without-helppack-integration
--without-java
--disable-odk
--disable-online-update
--disable-breakpad
--disable-lto
--disable-dconf
--disable-cve-tests
--without-doxygen
--enable-mergelibs
--enable-python=system
--enable-gtk3
--disable-gtk4
--disable-qt5
--disable-qt6
--disable-kf5
--disable-kf6
--enable-epm
--with-package-format=deb
--with-parallelism=12
