# HST Office - LibreOffice 26.8.1.1 configure options for Windows x86_64 (.msi), trial build.
# One argument per line; scripts/windows/trial-build.sh copies them to autogen.input and checks
# every name against the pinned configure.ac. @BRANDING@ is replaced by the staged branding dir.
# Derived from build-config/linux-x86_64.conf minus Linux-only switches. Full-build result: see docs/CI.md.
--host=x86_64-pc-cygwin
--with-visual-studio=2022
--enable-release-build
--with-product-name=HST Office
--with-vendor=HASON TECH
--with-extra-buildid=HST Office build from LibreOffice 26.8.1.1
--with-branding=@BRANDING@
--with-lang=vi
--with-myspell-dicts
--without-help
--without-helppack-integration
--without-java
--without-junit
--without-dotnet
--disable-odk
--disable-online-update
--disable-breakpad
--disable-lto
--disable-ccache
--disable-cve-tests
--without-doxygen
--enable-mergelibs
--with-package-format=msi
--with-parallelism=4
