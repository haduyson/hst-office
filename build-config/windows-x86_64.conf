# SPDX-License-Identifier: AGPL-3.0-only
# One argument per line; checked against LibreOffice 26.8.1.1 configure.ac.
# Native configure/build/installer validation: UNVERIFIED (OPS-01, SIGN-01, QA-01).
# Requires Windows x86_64, VS 2022 >=17.0, Windows SDK 10.0, Cygwin x86_64.
# Run from the pinned upstream/libreoffice directory after HST patch integration.
--host=x86_64-pc-cygwin
--with-visual-studio=2022
--with-windows-sdk=10.0
--enable-release-build
--with-product-name=HST Office
--with-vendor=HASON TECH
--with-branding=../../branding/libreoffice
--with-lang=vi
--with-myspell-dicts
--without-java
--disable-odk
--disable-online-update
--disable-breakpad
--with-package-format=msi
--with-parallelism=4
